name: CI

on:
  pull_request:
    branches:
      - develop
      - 'release-**'

permissions:
  id-token: write
  contents: read

env:
  CI: true
  DES_IONIC_CONFIG_JSON: ${{ secrets.DES_IONIC_CONFIG_JSON }}
  DES_IONIC_KEY: ${{ secrets.DES_IONIC_KEY }}

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: MACOS-ARM64
    steps:
      - name: 📨 Checkout
        uses: actions/checkout@v6

      - name: 🔍 Read .nvmrc
        id: nvm
        run: echo "node-version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: 🔧 Create .npmrc
        run: |
          # Use npm registry for @dvsa/biome-config
          echo "@dvsa/biome-config:registry=https://registry.npmjs.org/" >> .npmrc

          echo "@ionic-enterprise:registry=https://registry.ionicframework.com/" >> .npmrc
          echo "//registry.ionicframework.com/:_authToken=$DES_IONIC_KEY" >> .npmrc

      - name: ⚙️ Setup Node.js ${{ steps.nvm.outputs.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.nvm.outputs.node-version }}

      - name: ➕ Install dependencies
        run: npm ci

      - name: 🕵️‍♀️ Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  ci-checks:
    runs-on: MACOS-ARM64
    env:
      GEM_HOME: "~/.gem/des"
    steps:
      - name: 📨 Checkout
        uses: actions/checkout@v6

      - name: 🔍 Read .nvmrc
        id: nvm
        run: echo "node-version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: 🔧 Create .npmrc
        run: |
          # Use npm registry for @dvsa/biome-config
          echo "@dvsa/biome-config:registry=https://registry.npmjs.org/" >> .npmrc

          echo "@ionic-enterprise:registry=https://registry.ionicframework.com/" >> .npmrc
          echo "//registry.ionicframework.com/:_authToken=$DES_IONIC_KEY" >> .npmrc

      - name: 🔧 Create ionic.config.json
        run: echo "$DES_IONIC_CONFIG_JSON" >> ionic.config.json

      - name: ⚙️ Setup Node.js ${{ steps.nvm.outputs.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.nvm.outputs.node-version }}

      - name: ➕ Install dependencies
        run: npm ci

      - name: 🚀 Setup Paths
        run: echo "/opt/homebrew/bin:/opt/homebrew/sbin:$HOME/.rbenv/shims:${{ env.GEM_HOME }}/bin" >> $GITHUB_PATH

      - name: ⚒️ Build project
        run: npm run build:ci

      - name: 📝 Lint codebase
        run: npm run lint

      - name: 🧪️ Execute unit tests
        run: npm run test

