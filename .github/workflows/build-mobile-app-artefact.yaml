name: 📱 Build Mobile Artefact
run-name: "📱 ${{ github.ref_name }} - ${{ github.run_id }}"

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    tags:
      - release-*

permissions:
  id-token: write
  contents: write

jobs:
  develop:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'develop')
    uses: dvsa/des-workflow-actions/.github/workflows/build-mobile-app.yaml@main
    with:
      runs-on: mito-2
      environment: develop
      config-type: test
      build-simulator: true
      build-ipa: true
    secrets:
      AWS_ROLE: ${{ secrets.DES_AWS_ROLE }}

  feature:
    if: github.event_name == 'workflow_dispatch'
    uses: dvsa/des-workflow-actions/.github/workflows/build-mobile-app.yaml@main
    with:
      runs-on: mito-2
      environment: feature
      config-type: dev
      build-type: dev
      build-simulator: true
      build-ipa: true
    secrets:
      AWS_ROLE: ${{ secrets.DES_AWS_ROLE }}

  release:
    needs: get_release_branch
    if: github.event_name == 'push' && startsWith(github.ref_name, 'release-')
    uses: dvsa/des-workflow-actions/.github/workflows/build-mobile-app.yaml@main
    with:
      runs-on: mito-2
      environment: release
      config-type: dev
      build-type: qr
      build-ipa: true
    secrets:
      AWS_ROLE: ${{ secrets.DES_AWS_ROLE }}
