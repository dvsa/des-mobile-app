<ion-header>
  <ion-toolbar
    [ngClass]="{
      'no-internal-padding': true,
      'practice-theme': isEndToEndPracticeMode,
      'toolbar-no-padding': isExitSAMBannerActivated,
      'ion-no-padding-important': isEndToEndPracticeMode
    }"
    mode="ios">
    <test-flow-header
      class="display-flex flex-direction-column"
      [pageName]="'confirm-test-details'"
      [shouldShowEscapeFromSamButton]="!isRekey && !isDelegated"
      [isPracticeMode]="isEndToEndPracticeMode"
      [isExitSAMActivated]="isExitSAMBannerActivated"
      (exitSamUsed)="onUsedExitSam()"
      [shouldShowEndTestLink]="false"
      (setupLeaveSubscription)="setupEscapeSAMLeaveSubscription()"
      (setupResumeSubscription)="setupEscapeSAMResumeSubscription()"
      (onExitSAMActivatedChanged)="isSamActivatedChanged($event)">
      Confirm test details - {{ pageState.candidateUntitledName$ | async }}
    </test-flow-header>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" force-overscroll="false">
  <ion-card>
    <ion-card-header>
      <h2 id="confirm-test-details-header" class="des-header-style-4">Confirm test details</h2>
    </ion-card-header>

    <ion-card-content class="card-content-ios ion-no-padding">
      <ion-grid class="ion-padding">
        <!-- Candidate name -->
        <data-row [idPrefix]="idPrefix" [label]="'Candidate name'" [value]="pageState.candidateName$ | async">
        </data-row>
        <!-- Date and time of test -->
        <data-row
          [idPrefix]="idPrefix"
          [label]="'Date and time of test'"
          [value]="pageState.startDateTime$ | async | date: 'dd/MM/yyyy HH:mm'"
        >
        </data-row>
        <!-- Test outcome -->
        <data-row
          *ngIf="!isADI3(category) || (isADI3(category) && !isPassed(pageState.testOutcomeText$ | async))"
          [idPrefix]="idPrefix"
          [label]="'Test outcome'"
          [value]="pageState.testOutcomeText$ | async"
        >
        </data-row>
        <data-row
          *ngIf="isADI3(category) && isPassed(pageState.testOutcomeText$ | async)"
          [idPrefix]="idPrefix"
          [label]="'Test outcome'"
          [value]="pageState.testOutcomeFullResult$ | async"
        >
        </data-row>
        <!-- Activity Code -->
        <data-row
          [idPrefix]="idPrefix"
          [label]="'Activity code'"
          [value]="getActivityCode(pageState.activityCode$ | async)"
        >
        </data-row>
        <!-- Test Category -->
        <data-row
          [idPrefix]="idPrefix"
          [label]="'Test category'"
          [value]="pageState.testCategory$ | async"
          [shouldHaveSeperator]="!displayForCategory(category) || !displayD255(category) || isADI3(category)"
        >
        </data-row>
        <!-- Provisional licence received -->
        <data-row
          *ngIf="isPassed(pageState.testOutcomeText$ | async) && !displayForCategory(category)"
          [idPrefix]="idPrefix"
          [label]="'Provisional licence received'"
          [value]="getProvisionalText(pageState.provisionalLicense$ | async)"
        >
        </data-row>
        <!-- Transmission -->
        <transmission-display
          *ngIf="isPassed(pageState.testOutcomeText$ | async) && !displayForCategory(category)"
          [category]="category"
          [transmission]="pageState.transmission$ | async"
          [code78]="pageState.code78$ | async"
          [isTestSubmitted]="false"
        >
        </transmission-display>
        <!-- D255 -->
        <data-row
          *ngIf="!displayD255(category)"
          [idPrefix]="idPrefix"
          [label]="'D255'"
          [value]="getD255Text(pageState.d255$ | async)"
          [shouldHaveSeperator]="false"
        >
        </data-row>

        <div *ngIf="isADI3(category)">
          <!-- Student -->
          <data-row
            *ngIf="pageState.studentLevel$ | async"
            [idPrefix]="idPrefix"
            [label]="'Student'"
            [value]="pageState.studentLevel$ | async"
            [shouldHaveSeperator]="true"
          >
          </data-row>
          <!-- Lesson theme -->
          <data-row-custom
            *ngIf="(pageState.lessonTheme$ | async)?.length"
            [idPrefix]="idPrefix"
            [label]="'Lesson theme'"
            [shouldHaveSeperator]="true"
          >
              <span class="mes-data" [id]="'lesson-theme-'+lesson+'-'+i"
                    *ngFor="let lesson of (pageState.lessonTheme$ | async); let i = index">{{lesson}}<br></span>
          </data-row-custom>
          <!-- Lesson planning -->
          <data-row
            [idPrefix]="idPrefix"
            [label]="'Lesson planning'"
            [value]="pageState.lessonPlanningScore$ | async"
            [shouldHaveSeperator]="true"
          >
          </data-row>
          <!-- Risk management -->
          <data-row
            [idPrefix]="idPrefix"
            [label]="'Risk management'"
            [value]="pageState.riskManagementScore$ | async"
            [shouldHaveSeperator]="true"
          >
          </data-row>
          <!-- Teaching & learning strategies -->
          <data-row
            [idPrefix]="idPrefix"
            [label]="'Teaching & learning strategies'"
            [value]="pageState.teachingLearningStrategyScore$ | async"
            [shouldHaveSeperator]="true"
          >
          </data-row>
          <!-- Total score -->
          <data-row
            [idPrefix]="idPrefix"
            [label]="'Total score'"
            [value]="pageState.totalScore$ | async"
            [shouldHaveSeperator]="false"
          >
          </data-row>
        </div>
      </ion-grid>
    </ion-card-content>
  </ion-card>
</ion-content>

<ion-footer>
  <ion-row class="mes-full-width-card box-shadow flex-center">
    <ion-col class="ion-text-center width-100" size="35">
      <ion-button
        class="mes-grey-button width-100"
        (click)="goBackToDebrief()"
        id="confirm-test-details-back-to-debrief-btn"
      >
        <ion-text class="des-header-style-3" id="confirm-test-details-back-to-debrief-label">
          Back to debrief
        </ion-text>
      </ion-button>
    </ion-col>
    <ion-col size="10"></ion-col>
    <ion-col class="ion-text-center width-100" size="35">
      <ion-button
        class="mes-primary-button width-100"
        (click)="onSubmit()"
        id="confirm-test-details-submit-test-results-btn"
      >
        <ion-text class="des-header-style-3" id="confirm-test-details-submit-test-results-label">
          Submit test results
        </ion-text>
      </ion-button>
    </ion-col>
  </ion-row>
</ion-footer>
