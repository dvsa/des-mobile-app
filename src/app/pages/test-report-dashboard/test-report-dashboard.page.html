<ion-header>
  <practice-mode-banner *ngIf="isEndToEndPracticeMode || isPracticeMode"></practice-mode-banner>
  <ion-toolbar class="no-internal-padding"
               [ngClass]="{'toolbar-no-padding': isEndToEndPracticeMode || isExitSAMBannerActivated}" mode="ios">
    <test-flow-header
      class="display-flex flex-direction-column"
      [pageName]="'test-report-page-dashboard'"
      [shouldShowGenericEndTest]="true"
      [shouldShowEndTestLink]="false"
      [shouldShowEscapeFromSamButton]="!isRekey && !isDelegated"
      [isPracticeMode]="isEndToEndPracticeMode"
      (exitSamUsed)="onUsedExitSam()"
      [isExitSAMActivated]="isExitSAMBannerActivated"
      (setupLeaveSubscription)="setupEscapeSAMLeaveSubscription()"
      (setupResumeSubscription)="setupEscapeSAMResumeSubscription()"
      (endTestButtonClicked)="onContinueClick()"
      (onExitSAMActivatedChanged)="isSamActivatedChanged($event)">
      Test report - {{pageState.candidateUntitledName$ | async}}
    </test-flow-header>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-row class="mes-full-width-card-small-top ion-nowrap">
    <ion-col size="60">
      <h2 id="adi-pt3-dashboard-title" class="normal-font-weight ion-padding-start des-header-style-2">
        {{testCategory === 'SC' ? 'Standards check' : 'ADI part 3'}} assessment
      </h2>
    </ion-col>
    <ion-col>
      <timer class="ion-float-end"></timer>
    </ion-col>
  </ion-row>

  <dashboard-item
    (click)="navigateToPage('lessonTheme')"
    [title]="'Lesson & theme'"
    [isInvalid]="(hasClickedComplete || lessonAndThemeState?.score > 0) && lessonAndThemeState?.valid === false"
    [isValid]="lessonAndThemeState?.score > 0 && lessonAndThemeState?.valid === true"
    [showCompleted]="lessonAndThemeState?.score > 0 || (!!testDataADI3?.lessonAndTheme?.other && !isEmpty(testDataADI3?.lessonAndTheme?.other))"
    [score]="lessonAndThemeState?.score"
    [maxScore]="2"
    [idSelector]="'lesson-and-theme'"
  >
  </dashboard-item>

  <dashboard-item
    (click)="navigateToPage('testReport')"
    [title]="'Test report'"
    [isInvalid]="(hasClickedComplete || testReportState > 0) && testReportState < 17"
    [isValid]="testReportState === 17"
    [showCompleted]="testReportState > 0"
    [score]="testReportState"
    [maxScore]="17"
    [idSelector]="'test-report'"
  >
  </dashboard-item>

  <review-feedback [form]="form" [feedback]="pageState.feedback$ | async" (feedbackChange)="feedbackChanged($event)">
  </review-feedback>
</ion-content>

<ion-footer>
  <ion-row class="mes-full-width-card box-shadow flex-center footer-padding">
    <ion-col class="ion-text-center" size="60">
      <ion-button
        (click)="onContinueClick()"
        class="mes-primary-button"
        id="continue-button"
      >
        <ion-text id="continue-text" class="des-header-style-3">Continue</ion-text>
      </ion-button>
    </ion-col>
  </ion-row>
</ion-footer>
