<ion-header>
  <ion-toolbar
    [ngClass]="{
      'no-internal-padding': true,
      'practice-theme': isEndToEndPracticeMode,
      'toolbar-no-padding': isExitSAMBannerActivated,
      'ion-no-padding-important': isEndToEndPracticeMode
    }"
    mode="ios">
    <test-flow-header
      class="display-flex flex-direction-column"
      [pageName]="'non-pass-page'"
      [shouldShowEscapeFromSamButton]="!isRekey && !isDelegated"
      [isPracticeMode]="isEndToEndPracticeMode"
      [isExitSAMActivated]="isExitSAMBannerActivated"
      [shouldShowEndTestLink]="false"
      (backButtonClicked)="handleBackButtonClicked()"
      (setupLeaveSubscription)="setupEscapeSAMLeaveSubscription()"
      (setupResumeSubscription)="setupEscapeSAMResumeSubscription()"
      (onExitSAMActivatedChanged)="isSamActivatedChanged($event)">
      Finalise outcome - {{ candidateUntitledName() }}
    </test-flow-header>
  </ion-toolbar>
</ion-header>

<ion-content>
  <finalisation-header
    [candidateName]="candidateName()"
    [candidateDriverNumber]="candidateDriverNumber()"
    [candidatePrnNumber]="prn()"
    [isStandardsCheck]="isStandardsCheck()"
    [outcomeText]="testOutcomeText()"
    [grade]="testOutcomeGrade()"
    >
  </finalisation-header>

  <form [formGroup]="form">
    <ion-grid>
      <activity-code
        id="activity-code-card"
        [formGroup]="form"
        [activityCodeModel]="activityCodeState()"
        [activityCodeOptions]="activityCodeOptions"
        [isAdi3]="showADI3Field()"
        (activityCodeChange)="activityCodeChanged($event)"
        [disabled]="!!immediateDanger()"
        >
      </activity-code>

      <div class="ion-no-padding" [hidden]="!isTestOutcomeSet()">
        @if (showD255()) {
          <d255
            [display]="displayD255()"
            [d255]="d255()"
            [eyesightTestFailed]="eyesightTestFailed()"
            [outcome]="testOutcome()"
            [formGroup]="form"
            (d255Change)="d255Changed($event)"
            >
          </d255>
        }

        @if (d255()) {
          <warning-banner
            warningText="DVLA will not process the result until a D255 is received."
            >
          </warning-banner>
        }

        @if (showLanguage()) {
          <language-preferences
            [formGroup]="form"
            [isWelsh]="isWelshTest()"
            (welshChanged)="isWelshChanged($event)"
            >
          </language-preferences>
        }

        <debrief-witnessed
          [display]="displayDebriefWitnessed()"
          [formGroup]="form"
          [debriefWitnessed]="debriefWitnessed()"
          [outcome]="testOutcome()"
          (debriefWitnessedChange)="debriefWitnessedChanged($event)"
          >
        </debrief-witnessed>

        @if (showADIWarning()) {
          <warning-banner
            warningText="Advise PDI to seek further development from an ORDIT trainer"
            >
          </warning-banner>
        }

        <further-development
          [display]="displayFurtherDevelopment()"
          [formGroup]="form"
          [outcome]="testOutcome()"
          [furtherDevelopment]="furtherDevelopment()"
          (furtherDevelopmentChange)="furtherDevelopmentChanged($event)"
          >
        </further-development>

        @if (displayFurtherDevelopment() && (furtherDevelopment() !== false)) {
          <div
            class="mes-row-separator padding-top-10"
          ></div>
        }

        <reason-given
          [display]="displayAdviceReasonGiven()"
          [outcome]="testOutcome()"
          [formGroup]="form"
          [furtherDevelopment]="furtherDevelopment()"
          [reasonGivenText]="adviceReason()"
          (adviceReason)="adviceReasonChanged($event)"
          >
        </reason-given>

        @if (isStandardsCheck()) {
          <test-start-end-times
            [formGroup]="form"
            [startTime]="testStartTime()"
            [endTime]="testEndTime()"
            (testStartTimeChange)="testStartTimeChanged($event)"
            (testEndTimeChange)="testEndTimeChanged($event)"
            >
          </test-start-end-times>
        }
      </div>
    </ion-grid>
  </form>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-row class="box-shadow flex-center footer-padding">
      <ion-col size="60">
        <ion-button id="continue-button" class="mes-primary-button width-100" (click)="continue()">
          <ion-text class="des-header-style-3">Continue</ion-text>
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-toolbar>
</ion-footer>
