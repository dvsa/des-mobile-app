@if (candidateData || isPracticeMode) {
  <div id="candidate-licence-info-card" class="ion-padding">
    <ion-text class="des-header-style-4" id="candidate-licence-info-card-title">Licence information</ion-text>
    <ion-grid>
      <data-row [idPrefix]="idPrefix" [shouldHaveSeparator]="true" [label]="'Driver number'" [value]="driverNumber">
      </data-row>
      <data-row [idPrefix]="idPrefix" [shouldHaveSeparator]="true" [label]="'Name'" [value]="name"> </data-row>
      <data-row [idPrefix]="idPrefix" [shouldHaveSeparator]="true" [label]="'Age'" [value]="age"> </data-row>
      <data-row [idPrefix]="idPrefix" [shouldHaveSeparator]="true" [label]="'Gender'" [value]="gender"> </data-row>
      <data-row [idPrefix]="idPrefix" [shouldHaveSeparator]="true" [label]="'Card expiry date'" [value]="cardExpiryDate">
      </data-row>
      <data-row [idPrefix]="idPrefix" [shouldHaveSeparator]="true" [label]="'Signature'" [imgSrc]="signature"> </data-row>
    </ion-grid>
  </div>
}
