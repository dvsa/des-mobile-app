<ion-row [class.mes-row-separator]="shouldHaveSeparator" [formGroup]="formGroup">
  <ion-row>
    <div class="validation-bar" [class.ng-invalid]="invalid"></div>
    <ion-col size="4"></ion-col>
    <ion-col class="spacing-padding ion-align-self-start" size="28">
      <label>Alternative MOT evidence details</label>
    </ion-col>
    <ion-col size="58" class="spacing-padding ion-align-self-center ion-padding-start">
      <ion-row>
        <ion-col>
        <textarea
          id="evidence-description-text"
          formControlName="altEvidenceDetailsCtrl"
          class="vehicle-reg-input mes-data input-styling-background"
          charCount
          emojiBlock
          pasteSanitiser
          [charLimit]="950"
          [class.ng-invalid]="invalid"
          (onCharacterCountChanged)="characterCountChanged($event)"
          [value]="alternateEvidenceDescription"
          (change)="evidenceDescriptionTestResultChanged($event.target.value)"
        >
        </textarea>
          <div
            class="character-count validation-text"
            [ngClass]="{'ng-invalid': charactersExceeded()}"
            id="evidence-description-character-count}"
          >
            {{ getCharacterCountText() }}
          </div>
        </ion-col>
      </ion-row>
      <ion-row class="validation-message-row ion-align-items-center">
        <div
          class="validation-text"
          [class.ng-invalid]="invalid"
          *ngIf="invalid"
          id="evidence-description-validation-text"
        >
          Details of additional MOT evidence required
        </div>
      </ion-row>
    </ion-col>
  </ion-row>
</ion-row>
