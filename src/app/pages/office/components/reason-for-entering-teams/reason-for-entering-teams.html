<ion-row
  *ngIf="display"
  class="mes-component-row mes-validated-row mes-row-separator"
  id="reason-for-entering-teams-row"
  [formGroup]="formGroup"
>
  <div [class.ng-invalid]="invalid" class="validation-bar"></div>
  <ion-col class="component-label ion-align-self-start" size="31">
    <ion-row class="spacing-row"></ion-row>
    <label id="reason-for-entering-teams-label">Reason for leaving DES during the test</label>
  </ion-col>

  <ion-col class="ion-align-self-center ion-padding-start" size="58">
    <ion-row class="spacing-row"></ion-row>
    <ion-row>
      <ion-col class="textarea-input">
        <textarea
          id="reason-for-entering-teams-text"
          class="mes-data input-styling-background"
          name="additionalInformation"
          [formControlName]="fieldName"
          [class.ng-invalid]="invalid"
          [value]="reasonForOpeningTeams"
          (change)="additionalInformationChanged($event.target.value)"
          emojiBlock
          pasteSanitiser
        >
        </textarea>
      </ion-col>
    </ion-row>
    <ion-row class="validation-message-row ion-align-items-center">
      <div
        class="validation-text"
        [class.ng-invalid]="invalid"
        *ngIf="invalid"
        id="evidence-description-validation-text"
      >
        Reason for leaving DES during the test required
      </div>
    </ion-row>
    <ion-row *ngIf="invalid" class="spacing-row"></ion-row>
  </ion-col>
</ion-row>
