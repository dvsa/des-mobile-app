<ion-header>
  <ion-toolbar
    [ngClass]="{
      'no-internal-padding': true,
      'practice-theme': isEndToEndPracticeMode,
      'toolbar-no-padding': isExitSAMBannerActivated,
      'ion-no-padding-important': isEndToEndPracticeMode
    }"
    mode="ios">
    <test-flow-header
      class="display-flex flex-direction-column"
      [pageName]="'office-page'"
      [shouldShowEndTestLink]="false"
      [shouldShowBackButton]="isDelegated"
      [shouldShowEscapeFromSamButton]="false"
      [isPracticeMode]="isEndToEndPracticeMode">
      Office
    </test-flow-header>
  </ion-toolbar>
</ion-header>

<ion-content force-overscroll="false">
  <office-candidate-section
    [candidateName]="pageState.candidateName$ | async"
    [driverNumber]="pageState.candidateDriverNumber$ | async"
    [startTime]="pageState.startTime$ | async"
    [testOutcomeText]="pageState.testOutcomeText$ | async"
    [grade]="pageState.testOutcomeGrade$ | async"
    [candidatePrnNumber]="pageState.prn$ | async"
    [isStandardsCheck]="pageState.isStandardsCheck$ | async"
  >
  </office-candidate-section>

  <form [formGroup]="form">
    <ion-card>
      <ion-card-header>
        <h2 class="des-header-style-4">Test summary</h2>
      </ion-card-header>

      <ion-card-content class="card-content-ios ion-no-padding">
        <ion-grid class="grid">
          <activity-code
            id="activity-code-card"
            [formGroup]="form"
            [activityCodeModel]="pageState.activityCode$ | async"
            [activityCodeOptions]="activityCodeOptions"
            [isAdi3]="true"
            (activityCodeChange)="activityCodeChanged($event)"
            [disabled]="true"
          >
          </activity-code>

          <office-registration-and-mot
            [registrationNumber]="pageState.registrationNumber$ | async"
            [previousVRNs]="pageState.previouslySearchedVRNs$ | async"
            [vehicleMake]="pageState.vehicleMake$ | async"
            [motStatus]="pageState.motStatus$ | async"
            [motTestExpiryDate]="pageState.motTestExpiryDate$ | async"
            [vehicleModel]="pageState.vehicleModel$ | async"
          ></office-registration-and-mot>

          <alternate-mot-evidence-provided
            *ngIf="(pageState.motAlternativeEvidenceProvided$ | async) != null"
            [alternativeEvidenceProvided]="pageState.motAlternativeEvidenceProvided$ | async"
            [shouldHaveSeparator]="(pageState.motAlternativeEvidenceProvided$ | async) || (pageState.displayAdditionalInformation$ | async)"
          ></alternate-mot-evidence-provided>

          <alternate-mot-evidence-description
            [shouldHaveSeparator]="pageState.displayAdditionalInformation$ | async"
            *ngIf="pageState.motAlternativeEvidenceProvided$ | async"
            (evidenceDescriptionTestResultChange)="alternativeMOTEvidenceDescriptionUpdated($event)"
            [alternateEvidenceDescription]="pageState.motAlternativeEvidenceDescription$ | async"
            [formGroup]="form"
          >
          </alternate-mot-evidence-description>

          <div class="ion-no-padding" [hidden]="!(pageState.isTestOutcomeSet$ | async)">
            <additional-information
              [display]="pageState.displayAdditionalInformation$ | async"
              [additionalInformation]="pageState.additionalInformation$ | async"
              [formGroup]="form"
              [outcome]="pageState.testOutcome$ | async"
              (additionalInformationChange)="additionalInformationChanged($event)"
            >
            </additional-information>
          </div>

          <reason-for-entering-teams
            *ngIf="pageState.hasEnteredTeamsOnThisTest$ | async"
            [display]="pageState.hasEnteredTeamsOnThisTest$ | async"
            [reasonForOpeningTeams]="pageState.reasonForEnteringTeams$ | async"
            [formGroup]="form"
            (reasonForOpeningTeamsChange)="reasonForEnteringTeamsChanged($event)"
          ></reason-for-entering-teams>
        </ion-grid>
      </ion-card-content>
    </ion-card>
  </form>
</ion-content>

<ion-footer>
  <office-footer
    [isRekey]="isRekey"
    [isValidStartDateTime]="isValidStartDateTime"
    (saveClicked)="defer()"
    (submitClicked)="onSubmit($event)"
    (continueClicked)="goToReasonForRekey()"
  ></office-footer>
</ion-footer>
