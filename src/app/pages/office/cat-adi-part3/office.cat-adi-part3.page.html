<ion-header>
  <ion-toolbar
    [ngClass]="{
      'no-internal-padding': true,
      'practice-theme': isEndToEndPracticeMode,
      'toolbar-no-padding': isExitSAMBannerActivated,
      'ion-no-padding-important': isEndToEndPracticeMode
    }"
    mode="ios">
    <test-flow-header
      class="display-flex flex-direction-column"
      [pageName]="'office-page'"
      [shouldShowEndTestLink]="false"
      [shouldShowBackButton]="isDelegated"
      [shouldShowEscapeFromSamButton]="false"
      [isPracticeMode]="isEndToEndPracticeMode">
      Office
    </test-flow-header>
  </ion-toolbar>
</ion-header>

<ion-content force-overscroll="false">
  <office-candidate-section
    [candidateName]="candidateName()"
    [driverNumber]="candidateDriverNumber()"
    [startTime]="startTime()"
    [testOutcomeText]="testOutcomeText()"
    [grade]="testOutcomeGrade()"
    [candidatePrnNumber]="prn()"
    [isStandardsCheck]="isStandardsCheck()"
    >
  </office-candidate-section>

  <form [formGroup]="form">
    <ion-card>
      <ion-card-header>
        <h2 class="des-header-style-4">Test summary</h2>
      </ion-card-header>

      <ion-card-content class="card-content-ios ion-no-padding">
        <ion-grid class="grid">
          <activity-code
            id="activity-code-card"
            [formGroup]="form"
            [activityCodeModel]="activityCode()"
            [activityCodeOptions]="activityCodeOptions"
            [isAdi3]="true"
            (activityCodeChange)="activityCodeChanged($event)"
            [disabled]="true"
            >
          </activity-code>

          <office-registration-and-mot
            [registrationNumber]="registrationNumber()"
            [previousVRNs]="previouslySearchedVRNs()"
            [vehicleMake]="vehicleMake()"
            [motStatus]="motStatus()"
            [motTestExpiryDate]="motTestExpiryDate()"
            [vehicleModel]="vehicleModel()"
          ></office-registration-and-mot>

          @if ((motAlternativeEvidenceProvided()) != null) {
            <alternate-mot-evidence-provided
              [alternativeEvidenceProvided]="motAlternativeEvidenceProvided()"
              [shouldHaveSeparator]="(motAlternativeEvidenceProvided()) || (displayAdditionalInformation())"
            ></alternate-mot-evidence-provided>
          }

          @if (motAlternativeEvidenceProvided()) {
            <alternate-mot-evidence-description
              [shouldHaveSeparator]="displayAdditionalInformation()"
              (evidenceDescriptionTestResultChange)="alternativeMOTEvidenceDescriptionUpdated($event)"
              [alternateEvidenceDescription]="motAlternativeEvidenceDescription()"
              [formGroup]="form"
              >
            </alternate-mot-evidence-description>
          }

          <div class="ion-no-padding" [hidden]="!(isTestOutcomeSet())">
            <additional-information
              [display]="displayAdditionalInformation()"
              [additionalInformation]="additionalInformation()"
              [formGroup]="form"
              [outcome]="testOutcome()"
              (additionalInformationChange)="additionalInformationChanged($event)"
              [shouldShowSeparator]="hasEnteredTeamsOnThisTest()"
            >
            </additional-information>
          </div>

          @if (hasEnteredTeamsOnThisTest()) {
            <reason-for-entering-teams
              [display]="hasEnteredTeamsOnThisTest()"
              [reasonForOpeningTeams]="reasonForEnteringTeams()"
              [formGroup]="form"
              (reasonForOpeningTeamsChange)="reasonForEnteringTeamsChanged($event)"
            ></reason-for-entering-teams>
          }
        </ion-grid>
      </ion-card-content>
    </ion-card>
  </form>
</ion-content>

<ion-footer>
  <office-footer
    [isRekey]="isRekey"
    [isValidStartDateTime]="isValidStartDateTime"
    (saveClicked)="defer()"
    (submitClicked)="onSubmit($event)"
    (continueClicked)="goToReasonForRekey()"
  ></office-footer>
</ion-footer>
