<ion-row *ngIf="display" class="mes-validated-row mes-row-separator" id="circuit-card" [formGroup]="formGroup">
  <div class="validation-bar" [class.ng-invalid]="invalid"></div>
  <ion-col class="component-label ion-align-self-center" size="32">
    <label id="circuit-label">Circuit</label>
  </ion-col>
  <ion-col class="ion-align-self-center ion-padding-start">
    <ion-row class="spacing-row"></ion-row>
    <ion-row>
      <ion-radio-group
        class="display-flex radio-group-width"
        formControlName="circuit"
        [value]="formControl.value"
        (ionChange)="circuitChanged($event.detail.value)">
        <ion-col size="40">
          <ion-radio
            class="gds-refactor-radio"
            [class.ng-invalid]="invalid"
            id="circuit-left"
            labelPlacement="end"
            value="Left">
            <label class="radio-label" id="circuit-left-label">
              Left
            </label>
          </ion-radio>
        </ion-col>
        <ion-col size="16"></ion-col>
        <ion-col>
          <ion-radio
            class="gds-refactor-radio"
            [class.ng-invalid]="invalid"
            id="circuit-right"
            value="Right"
            labelPlacement="end">
            <label class="radio-label" id="circuit-right-label">
              Right
            </label>
          </ion-radio>
        </ion-col>
      </ion-radio-group>
    </ion-row>
    <ion-row class="validation-message-row ion-align-items-center">
      <div class="validation-text" id="circuit-validation-text" [class.ng-invalid]="invalid">Select the circuit</div>
    </ion-row>
  </ion-col>
</ion-row>
