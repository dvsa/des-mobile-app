<ion-header>
  <ion-toolbar mode="ios">
    <ion-buttons slot="end">
      <ion-button
        class="white-text"
        id="test-centre-journal-btn"
        (click)="onCloseClicked()">
        <ion-icon class="close-btn" name="close-outline"></ion-icon>
        <ion-label class="close-btn">Close</ion-label>
      </ion-button>
    </ion-buttons>
    <ion-title id="test-centre-journal-title" role="heading" aria-level="1">Test centre journal</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <offline-banner [isOffline]="pageState.isOffline$ | async"></offline-banner>

  <ion-row>
    <ion-col class="display-flex ion-align-items-center padding-left">
      <refresh-button
        (refreshButtonClicked)="getTestCentreData(true)"
        [lastSyncTime]="pageState.lastRefreshedTime$ | async"
      ></refresh-button>
    </ion-col>
  </ion-row>

  <ng-template [ngIf]="didError" [ngIfElse]="noError">
    <error-message class="error" returnTo="{{errorMessage}}" [displayAsModal]="false"></error-message>
  </ng-template>

  <ng-template #noError>
    <div class="search-inputs" *ngIf="isLDTM || testCentreResults">
      <tabs (tabChanged)="tabChanged($event?.title)">
        <tab [tabTitle]="'Candidate search'" id="candidate-search-tab">
          <candidate-search-card
            #candidateSearchCard
            [testCentreName]="testCentreNames"
            [testCentreResults]="testCentreResults"
            [manuallyRefreshed]="manuallyRefreshed"
            [testCentres]="pageState.activeTestCentres$ | async"
            [isLDTM]="isLDTM"
            [selectedTestCentre]="testCentreSelected"
            (testCentreChanged)="testCentreChange($event)"
          >
          </candidate-search-card>
        </tab>
        <tab [tabTitle]="'View journals'" id="view-journals-tab">
          <view-journals-card
            #viewJournalsCard
            [testCentreName]="testCentreNames"
            [manuallyRefreshed]="manuallyRefreshed"
            [testCentreResults]="testCentreResults"
            [testCentres]="pageState.activeTestCentres$ | async"
            [isLDTM]="isLDTM"
            [selectedTestCentre]="testCentreSelected"
            (testCentreChanged)="testCentreChange($event)"
          >
          </view-journals-card>
        </tab>
      </tabs>
    </div>
  </ng-template>
</ion-content>
