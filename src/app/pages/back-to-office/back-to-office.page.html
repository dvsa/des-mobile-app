<ion-header>
  <ion-toolbar
    [ngClass]="{
      'no-internal-padding': true,
      'practice-theme': isEndToEndPracticeMode,
      'toolbar-no-padding': isExitSAMBannerActivated,
      'ion-no-padding-important': isEndToEndPracticeMode
    }"
    mode="ios">
    <test-flow-header
      class="display-flex flex-direction-column"
      [pageName]="'back-to-office-page'"
      [shouldShowEndTestLink]="false"
      [shouldShowBackButton]="false"
      [shouldShowEscapeFromSamButton]="false"
      [isPracticeMode]="isEndToEndPracticeMode">
      Back to office
    </test-flow-header>
  </ion-toolbar>
</ion-header>

<ion-content [forceOverscroll]="false" id="back-to-office-page">
  <div class="container">
    <img id="dvsa-logo" ngSrc="assets/imgs/back-to-office/logo.png" alt="DVSA Logo" height="2567" width="4096"/>
  </div>

  <div class="container">
    <ion-button
      class="mes-neutral-button office-button top-button"
      (click)="navigateForward(office)"
      id="continue-to-write-up"
      >
      Continue to write up
    </ion-button>
  </div>
  @if (!isRekey) {
    <div class="container">
      <ion-button
        class="mes-neutral-button office-button bottom-button"
        (click)="navigateForward(journal)"
        id="return-to-journal"
        >
        Return to journal
      </ion-button>
    </div>
  }
</ion-content>
