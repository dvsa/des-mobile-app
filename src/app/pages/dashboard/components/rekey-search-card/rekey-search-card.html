<ion-button class="rekey-search-card" id="rekey-search-button" (click)="navigateToRekeySearch()">
  <ion-grid id="card-content-wrapper">
    <ion-row class="icon-row">
      <img
        ngSrc="assets/imgs/dashboard/search-rekey.png"
        alt="Search test bookings to rekey"
        class="icon-search-rekey-tests"
        aria-hidden="true"
        height="144" width="144"/>
    </ion-row>
    <ion-row class="width-100">
      <div class="mes-neutral-button width-100">
        <ion-text class="des-header-style-3">{{ isDelegatedExaminer ? 'Rekey DVSA test' : 'Rekey test' }}</ion-text>
      </div>
    </ion-row>
  </ion-grid>
</ion-button>
