<ion-header>
  <ion-toolbar
    [ngClass]="{
      'no-internal-padding': true,
      'practice-theme': isEndToEndPracticeMode,
      'toolbar-no-padding': isExitSAMBannerActivated,
      'ion-no-padding-important': isEndToEndPracticeMode,
    }"
    mode="ios">
    <test-flow-header
      class="display-flex flex-direction-column"
      [testCategory]="testCategory"
      [isDelegatedRekey]="isDelegated"
      [shouldShowEscapeFromSamButton]="!isDelegated && !isRekey"
      [pageName]="'waiting-room-page'"
      [isPracticeMode]="isEndToEndPracticeMode"
      [isExitSAMActivated]="isExitSAMBannerActivated"
      [shouldIncludeLanguageDirectiveOnTitle]="true"
      (setupLeaveSubscription)="setupEscapeSAMLeaveSubscription()"
      (setupResumeSubscription)="setupEscapeSAMResumeSubscription()"
      (exitSamUsed)="onUsedExitSam()"
      (onExitSAMActivatedChanged)="isSamActivatedChanged($event)">
      {{ 'waitingRoom.title' | translate }} - {{ candidateUntitledName }}
    </test-flow-header>
  </ion-toolbar>
</ion-header>

<ion-content force-overscroll="false">
  <lock-screen-indicator></lock-screen-indicator>

  <form [formGroup]="formGroup">
    <candidate-section
      (continueClickEvent)="onSubmit()"
      [candidateDriverNumber]="candidateDriverNumber"
      [candidateName]="candidateName"
      [showVRNButton]="showVrnButton"
    >
    </candidate-section>

    <manoeuvres-pass-cert
      *ngIf="showManoeuvresPassCertNumber"
      (manoeuvresPassCertificateNumberChange)="manoeuvresPassCertNumberChanged($event)"
      [formGroup]="formGroup"
      [manoeuvresPassCertificateNumber]="manoeuvresPassCertNumber()">
    </manoeuvres-pass-cert>

    <cbt-number
      *ngIf="showCbtNumber"
      (cbtNumberChange)="cbtNumberChanged($event)"
      [cbtNumber]="cbtNumber()"
      [formGroup]="formGroup"
    >
    </cbt-number>

    <div class="mes-full-width-card-separator"></div>

    <conducted-language
      (englishTextSelect)="dispatchCandidateChoseToProceedInEnglish()"
      (welshTextSelect)="dispatchCandidateChoseToProceedInWelsh()"
      [englishIsSelected]="conductedLanguage() === 'English'"
      [shouldRender]="welshTest()"
      [welshIsSelected]="conductedLanguage() === 'Cymraeg'"
    >
    </conducted-language>

    <div [ngClass]="{
            'mes-full-width-card-no-padding-top': (showManoeuvresPassCertNumber || showCbtNumber),
            'mes-full-width-card': (!showManoeuvresPassCertNumber && !showCbtNumber)
        }" id="declaration-section">
      <ion-row>
        <ion-col>
          <ion-text addOrRemoveLangCy class="des-header-style-4" id="waiting-room-declaration-intent"
          >{{ 'waitingRoom.declarationIntent' | translate }}:
          </ion-text>
        </ion-col>
      </ion-row>

      <div class="waiting-room-declarations">
        <insurance-declaration
          (insuranceDeclarationChange)="insuranceDeclarationChanged($event)"
          [formGroup]="formGroup"
          [selected]="insuranceDeclarationAccepted()">
        </insurance-declaration>

        <br>
        <div class="mes-row-separator"></div>
        <br>

        <residency-declaration
          *ngIf="showResidencyDec"
          (residencyDeclarationChange)="residencyDeclarationChanged($event)"
          [formGroup]="formGroup"
          [selected]="residencyDeclarationAccepted()">
        </residency-declaration>
      </div>

      <div *ngIf="!showResidencyDec" class="signature-area-padding"></div>

      <signature
        (signatureCleared)="signatureCleared()"
        (signatureDataChange)="signatureChanged($event)"
        [formGroup]="formGroup"
        [signature]="signature()">
      </signature>
    </div>
  </form>
</ion-content>
