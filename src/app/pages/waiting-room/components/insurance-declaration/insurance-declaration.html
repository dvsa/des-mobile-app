<ion-row>
  <ion-col>
    <ul class="ion-no-margin">
      <li>
        <p addOrRemoveLangCy id="waiting-room-insurance-declaration">
          {{ 'waitingRoom.insuranceDeclaration' | translate }}
        </p>
      </li>
    </ul>
  </ion-col>
</ion-row>
<ion-row [formGroup]="formGroup">
  <div class="validation-bar" [class.ng-invalid]="isInvalid()"></div>
  <ion-col>
    <ion-row>
      <ion-col class="declaration-checkbox-row">
        <ion-checkbox
          addOrRemoveLangCy
          [class.ng-invalid]="isInvalid()"
          id="insurance-declaration-checkbox"
          formControlName="insuranceCheckbox"
          [checked]="selected"
          (click)="insuranceDeclarationChanged($event.target.checked)"
          labelPlacement="end"
          class="gds-checkbox-refactor">
          {{'waitingRoom.confirm' | translate}}
        </ion-checkbox>
      </ion-col>
    </ion-row>
    <ion-row *ngIf="isInvalid()">
      <ion-col>
        <div
          addOrRemoveLangCy
          id="waiting-room-insurance-validation-text"
          class="validation-text-with-row-spacing"
          [class.ng-invalid]="isInvalid()"
        >
          {{ 'waitingRoom.insuranceDeclarationValidation' | translate }}
        </div>
      </ion-col>
    </ion-row>
  </ion-col>
</ion-row>
