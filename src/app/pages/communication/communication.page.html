<ion-header>
  <ion-toolbar
    [ngClass]="{
      'no-internal-padding': true,
      'practice-theme': isEndToEndPracticeMode,
      'toolbar-no-padding': isExitSAMBannerActivated,
      'ion-no-padding-important': isEndToEndPracticeMode
    }"
    mode="ios">
    <test-flow-header
      class="display-flex flex-direction-column"
      [testCategory]="testCategory"
      [shouldShowEscapeFromSamButton]="!isRekey && !isDelegated"
      [shouldIncludeLanguageDirectiveOnTitle]="true"
      [pageName]="'communication-page-title'"
      [isPracticeMode]="isEndToEndPracticeMode"
      [isExitSAMActivated]="isExitSAMBannerActivated"
      (exitSamUsed)="onUsedExitSam()"
      (setupLeaveSubscription)="setupEscapeSAMLeaveSubscription()"
      (setupResumeSubscription)="setupEscapeSAMResumeSubscription()"
      (onExitSAMActivatedChanged)="isSamActivatedChanged($event)">
      {{ 'communication.title' | translate }} - {{candidateUntitledName}}
    </test-flow-header>
  </ion-toolbar>
</ion-header>

<ion-content>
  <lock-screen-indicator></lock-screen-indicator>
  <div>
    <form [formGroup]="form">
      <candidate-section
        (continueClickEvent)="onSubmit()"
        [candidateDriverNumber]="candidateDriverNumber"
        [candidateName]="candidateName"
        [candidatePrnNumber]="prn"
        [isStandardsCheck]="isStandardsCheck"
        [showVRNButton]="showVrnBtn"
      >
      </candidate-section>

      <valid-certificate
        (validCertificateChange)="validCertificateChanged($event)"
        *ngIf="isStandardsCheck"
        [formGroup]="form"
        [validCertificate]="validCertificate"
      ></valid-certificate>

      <div class="mes-full-width-card-separator"></div>

      <privacy-notice
        [category]="testCategory"
        [language]="conductedLanguage"
      ></privacy-notice>

      <div class="mes-full-width-card" id="declaration-section">
        <ion-row class="mes-validated-row">
          <ion-col>
            <div class="communication-text-container">
              <ion-text addOrRemoveLangCy class="des-header-style-4" id="comms-instruction-header"
                >{{ 'communication.instructionHeader' | translate }}</ion-text
              >
            </div>
            <div class="validation-bar"></div>
            <ion-col>
              <provided-email
                (providedEmailRadioSelect)="dispatchCandidateChoseProvidedEmail()"
                [formGroup]="form"
                [isProvidedEmailAddressChosen]="isProvidedEmailSelected()"
                [providedEmailAddress]="candidateProvidedEmail()"
                [shouldRender]="!!(candidateProvidedEmail)"
              >
              </provided-email>

              <new-email
                (newEmailRadioSelect)="conditionalDispatchCandidateChoseNewEmail()"
                (newEmailTextChange)="dispatchCandidateChoseNewEmail($event)"
                [formGroup]="form"
                [isNewEmailAddressChosen]="isNewEmailSelected()"
              >
              </new-email>

              <postal-address
                (postalRadioSelect)="dispatchCandidateChosePost()"
                [formGroup]="form"
                [isPostalAddressChosen]="isPostSelected()"
                [postalAddress]="candidateAddress"
              >
              </postal-address>

              <ion-row class="validation-message-row">
                <div class="validation-text"></div>
              </ion-row>
            </ion-col>
          </ion-col>
        </ion-row>
      </div>
    </form>
  </div>
</ion-content>
