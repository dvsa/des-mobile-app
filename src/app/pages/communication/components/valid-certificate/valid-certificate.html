<ion-row
  class="mes-validated-row-short mes-row-separator mes-row-separator-top"
  id="valid-certificate-row"
  [formGroup]="formGroup"
>
  <div class="validation-bar" [class.ng-invalid]="invalid"></div>
  <ion-col class="component-label ion-align-self-center" size="32">
    <label id="candidate-appearance-valid-certificate-label">Valid certificate</label>
  </ion-col>
  <ion-col class="ion-align-self-center ion-padding-start">
    <ion-row class="spacing-row"></ion-row>
    <ion-row>
      <ion-radio-group
        class="display-flex radio-group-width"
        formControlName="validCertificate"
        (ionChange)="validCertificateChanged($event.detail.value)">
        <ion-col size="40">
          <ion-radio
            class="gds-refactor-radio"
            [class.ng-invalid]="invalid"
            id="valid-certificate-yes"
            labelPlacement="end"
            [value]="true">
            <label class="radio-label" id="valid-certificate-yes-label">
              Yes
            </label>
          </ion-radio>
        </ion-col>
        <ion-col size="16"></ion-col>
        <ion-col>
          <ion-radio
            class="gds-refactor-radio"
            [class.ng-invalid]="invalid"
            id="valid-certificate-no"
            [value]="false"
            labelPlacement="end">
            <label class="radio-label" id="valid-certificate-no-label">
              No
            </label>
          </ion-radio>
        </ion-col>
      </ion-radio-group>
    </ion-row>
    <ion-row class="validation-message-row ion-align-items-center">
      <div class="validation-text" id="valid-certificate-validation-text" [class.ng-invalid]="invalid">
        You need to have a valid certificate to continue
      </div>
    </ion-row>
  </ion-col>
</ion-row>
