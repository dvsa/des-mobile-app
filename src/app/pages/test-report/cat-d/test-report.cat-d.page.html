<ion-header>
  <ion-toolbar
    [ngClass]="{
      'no-internal-padding': true,
      'practice-theme': isEndToEndPracticeMode,
      'toolbar-no-padding': isExitSAMBannerActivated,
      'ion-no-padding-important': isEndToEndPracticeMode
    }"
    mode="ios">
    <test-flow-header
      class="display-flex flex-direction-column"
      [pageName]="'test-report-page-cat-d'"
      [shouldShowGenericEndTest]="true"
      [shouldShowEndTestLink]="false"
      [shouldShowBackButton]="isDelegated"
      [shouldShowEscapeFromSamButton]="!isRekey && !isDelegated"
      [isPracticeMode]="isEndToEndPracticeMode"
      (exitSamUsed)="onUsedExitSam()"
      [isExitSAMActivated]="isExitSAMBannerActivated"
      (setupLeaveSubscription)="setupEscapeSAMLeaveSubscription()"
      (setupResumeSubscription)="setupEscapeSAMResumeSubscription()"
      (endTestButtonClicked)="onEndTestClick()"
      (onExitSAMActivatedChanged)="isSamActivatedChanged($event)">
      Test report - {{candidateUntitledName}}
    </test-flow-header>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-no-padding" [ngClass]="{'overflow': !isDelegated}" force-overscroll="false">
    <test-report-toolbar
    [category]="category"
    [testData]="testData()"
    [isDangerousMode]="isDangerousMode()"
    [isSeriousMode]="isSeriousMode()"
    [isRemoveFaultMode]="isRemoveFaultMode()"
  ></test-report-toolbar>
  <ion-grid
    class="grid-layout"
    [ngClass]="{
      'remove-mode': isRemoveFaultMode(),
      'add-mode': !isRemoveFaultMode(),
      'fault-mode': !isSeriousMode() && !isDangerousMode(),
      'serious-mode': isSeriousMode(),
      'dangerous-mode': isDangerousMode()
    }"
  >
    <ion-row class="first-row-adjust">
      <!-- Column 1-->
      <ion-col size="32">
        <ion-row class="padding-top-10 only-top-padding">
          <ion-col size="46">
            <multi-legal-requirement
              [legalRequirement1]="legalRequirements.normalStart1"
              [legalRequirement2]="legalRequirements.normalStart2"
              [requirement1Ticked]="(testRequirements())![legalRequirements.normalStart1]"
              [requirement2Ticked]="(testRequirements())![legalRequirements.normalStart2]"
              label="NS"
              [disabled]="isDelegated"
            >
            </multi-legal-requirement>
          </ion-col>
          <ion-col size="4"></ion-col>
          <ion-col size="46">
            <multi-legal-requirement
              [legalRequirement1]="legalRequirements.busStop1"
              [legalRequirement2]="legalRequirements.busStop2"
              [requirement1Ticked]="(testRequirements())![legalRequirements.busStop1]"
              [requirement2Ticked]="(testRequirements())![legalRequirements.busStop2]"
              label="BS"
              [disabled]="isDelegated"
            >
            </multi-legal-requirement>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col size="28">
            <legal-requirement
              [legalRequirement]="legalRequirements.uphillStart"
              [ticked]="(testRequirements())![legalRequirements.uphillStart]"
              [disabled]="isDelegated"
            >
            </legal-requirement>
          </ion-col>
          <ion-col size="28">
            <legal-requirement
              [legalRequirement]="legalRequirements.downhillStart"
              [ticked]="(testRequirements())![legalRequirements.downhillStart]"
              [disabled]="isDelegated"
            >
            </legal-requirement>
          </ion-col>
          <ion-col size="40">
            <legal-requirement
              [legalRequirement]="legalRequirements.angledStartControlledStop"
              [ticked]="(testRequirements())![legalRequirements.angledStartControlledStop]"
            >
            </legal-requirement>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col class="ion-no-padding">
            <div class="dark-divider"></div>
          </ion-col>
        </ion-row>
        <ion-row *ngIf="isDelegated">
          <ion-col>
            <reverse-left
              [completed]="manoeuvresCompleted()"
              [controlLabel]="'Reverse Left'"
              [clickCallback]="getCallback()"
              [testCategory]="category"
            >
              <reverse-left-popover [testCategory]="category" [disableDrivingFaults]="true">
              </reverse-left-popover>
            </reverse-left>
          </ion-col>
        </ion-row>
        <ion-row *ngIf="isDelegated">
          <ion-col class="ion-no-padding">
            <div class="dark-divider"></div>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <eco></eco>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col class="ion-no-padding">
            <div class="dark-divider"></div>
          </ion-col>
        </ion-row>
        <ion-row [ngClass]="{'blank-spacer': !isDelegated}">
          <ion-col class="ion-no-padding">
            <h2 class="section-header">Vehicle checks</h2>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col size="45">
            <vehicle-checks-compact-cat-d [testCategory]="category" id="vehicleChecksCatD">
            </vehicle-checks-compact-cat-d>
          </ion-col>
          <ion-col size="51">
            <safety-questions-cat-d [testCategory]="category"> </safety-questions-cat-d>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col class="ion-no-padding">
            <div class="dark-divider"></div>
          </ion-col>
        </ion-row>
        <ion-row [ngStyle]="{'visibility': showUncoupleRecouple() ? 'visible' : 'hidden' }">
          <ion-col>
            <uncouple-recouple [category]="category" [disableDrivingFaults]="true">
            </uncouple-recouple>
          </ion-col>
        </ion-row>
        <ion-row *ngIf="showUncoupleRecouple()">
          <ion-col class="ion-no-padding">
            <div class="dark-divider"></div>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <pcv-door-exercise></pcv-door-exercise>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col class="ion-no-padding">
            <div class="dark-divider"></div>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <eta [eta]="eta.verbal"> </eta>
          </ion-col>
          <ion-col>
            <eta [eta]="eta.physical"> </eta>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col class="ion-no-padding">
            <h2 class="section-header">Control</h2>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.controlsAccelerator"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.controlsClutch"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.controlsGears"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.controlsFootbrake"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.controlsParkingBrake"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.controlsSteering"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col class="ion-no-padding">
            <div class="dark-divider"></div>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.precautions"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col class="ion-no-padding">
            <div class="dark-divider"></div>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.ancillaryControls"></competency>
          </ion-col>
        </ion-row>
      </ion-col>
      <!-- Column 2-->
      <ion-col size="32">
        <ion-row>
          <ion-col class="ion-no-padding">
            <h2 class="section-header">Move off</h2>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.moveOffSafety"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.moveOffControl"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col class="ion-no-padding">
            <h2 class="section-header">Use of mirrors</h2>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.useOfMirrorsSignalling"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.useOfMirrorsChangeDirection"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.useOfMirrorsChangeSpeed"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col class="ion-no-padding">
            <h2 class="section-header">Signals</h2>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.signalsNecessary"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.signalsCorrectly"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.signalsTimed"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col class="ion-no-padding">
            <h2 class="section-header">Junctions</h2>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.junctionsApproachSpeed"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.junctionsObservation"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.junctionsTurningRight"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.junctionsTurningLeft"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.junctionsCuttingCorners"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col class="ion-no-padding">
            <h2 class="section-header">Judgement</h2>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.judgementOvertaking"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.judgementMeeting"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.judgementCrossing"></competency>
          </ion-col>
        </ion-row>
      </ion-col>
      <!-- Column 3-->
      <ion-col size="32">
        <ion-row>
          <ion-col class="ion-no-padding">
            <h2 class="section-header">Positioning</h2>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.positioningNormalDriving"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.positioningLaneDiscipline"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col class="padding-top-22 only-top-padding">
            <div class="dark-divider"></div>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.pedestrianCrossings"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col class="ion-no-padding">
            <div class="divider"></div>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.positionNormalStops"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col class="ion-no-padding">
            <div class="divider"></div>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.awarenessPlanning"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col class="ion-no-padding">
            <div class="divider"></div>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.clearance"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col class="ion-no-padding">
            <div class="divider"></div>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.followingDistance"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col class="ion-no-padding">
            <div class="divider"></div>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.useOfSpeed"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col class="ion-no-padding">
            <h2 class="section-header">Progress</h2>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.progressAppropriateSpeed"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.progressUndueHesitation"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col class="ion-no-padding">
            <h2 class="section-header">Response to signs / signals</h2>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.responseToSignsTrafficSigns"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.responseToSignsRoadMarkings"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.responseToSignsTrafficLights"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.responseToSignsTrafficControllers"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.responseToSignsOtherRoadUsers"></competency>
          </ion-col>
        </ion-row>
      </ion-col>
    </ion-row>
  </ion-grid>
  <div
    class="report-overlay report-overlay-modal"
    [class.contract]="isSeriousMode() || isDangerousMode()"
    [class.show-overlay]="displayOverlay"
  ></div>
  <div
    class="report-overlay report-overlay-remove"
    [class.contract]="isSeriousMode() || isDangerousMode()"
    [class.show-overlay]="isRemoveFaultMode()"
  ></div>
</ion-content>
