<div class="vehicle-checks-competency">
  <driving-faults-badge
    class="driving-faults"
    [count]="vehicleChecksDrivingFaultCount()"
  ></driving-faults-badge>
  <span class="competency-label">SM/TM</span>
  <div class="fault-wrapper">
    <serious-fault-badge
      [showBadge]="vehicleChecksSeriousFaultCount() > 0"
    ></serious-fault-badge>
  </div>
</div>
