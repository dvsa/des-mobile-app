<ng-container
  *ngIf="{
  manoeuvres: (manoeuvres$ | async)![0]
} as asyncData1"
>
  <h3 class="popover-title des-header-style-3">Manoeuvre 1</h3>
  <ion-grid class="popover-content">
    <ion-row>
      <ion-col size="36">
        <ion-radio-group
          name="manoeuvres1"
          tabindex="0"
          (focus)="manageGroupFocus($event.target, 0)"
          (ionChange)="recordManoeuvreSelection($event.detail.value, 0)"
          [value]="getSelectedManoeuvre(asyncData1)"
          class="display-flex direction-column">
          <ion-row class="bottom-padding">
            <ion-col>
              <ion-radio
                class="gds-refactor-radio"
                (ionFocus)="manageRadioFocus($event.target)"
                [disabled]="(shouldHideManoeuvre(manoeuvreTypes.reverseRight, 0) | async)"
                id="manoeuvres-reverse-right-radio1"
                labelPlacement="end"
                [value]="manoeuvreTypes.reverseRight">
                <label
                  class="radio-label"
                  id="manoeuvres-reverse-right-radio-label1"
                >
                  Reverse right
                </label>
              </ion-radio>
            </ion-col>
          </ion-row>
          <ion-row class="bottom-padding">
            <ion-col>
              <ion-radio
                class="gds-refactor-radio"
                (ionFocus)="manageRadioFocus($event.target)"
                [disabled]="(shouldHideManoeuvre(manoeuvreTypes.reverseParkRoad, 0) | async)"
                id="manoeuvres-reverse-park-road-radio1"
                labelPlacement="end"
                [value]="manoeuvreTypes.reverseParkRoad">
                <label
                  class="radio-label"
                  id="manoeuvres-reverse-park-road-radio-label1"
                >
                  Reverse park (road)
                </label>
              </ion-radio>
            </ion-col>
          </ion-row>
          <ion-row class="bottom-padding">
            <ion-col>
              <ion-radio
                class="gds-refactor-radio"
                (ionFocus)="manageRadioFocus($event.target)"
                [disabled]="(shouldHideManoeuvre(manoeuvreTypes.reverseParkCarpark, 0) | async)"
                id="manoeuvres-reverse-park-carpark-radio1"
                labelPlacement="end"
                [value]="manoeuvreTypes.reverseParkCarpark">
                <label
                  class="radio-label"
                  id="manoeuvres-reverse-park-carpark-label1"
                >
                  Reverse park (car park)
                </label>
              </ion-radio>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col>
              <ion-radio
                class="gds-refactor-radio"
                (ionFocus)="manageRadioFocus($event.target)"
                [disabled]="(shouldHideManoeuvre(manoeuvreTypes.forwardPark, 0) | async)"
                id="manoeuvres-forward-park-radio1"
                labelPlacement="end"
                [value]="manoeuvreTypes.forwardPark">
                <label
                  class="radio-label"
                  id="manoeuvres-forward-park-radio-label1"
                >
                  Forward park
                </label>
              </ion-radio>
            </ion-col>
          </ion-row>
        </ion-radio-group>
      </ion-col>
      <ion-col
        class="manoeuvre-competencies-container manoeuvre-competency-button"
        size="8"
        *ngIf="asyncData1.manoeuvres.reverseRight?.selected"
      >
        <manoeuvre-competency-adi-part2
          [manoeuvre]="manoeuvreTypes.reverseRight"
          [competency]="competencies.controlFault"
          [attr.id]="getId(manoeuvreTypes.reverseRight, competencies.controlFault, 1)"
          index="0"
        ></manoeuvre-competency-adi-part2>
        <manoeuvre-competency-adi-part2
          class="second"
          [attr.id]="getId(manoeuvreTypes.reverseRight, competencies.observationFault, 1)"
          [manoeuvre]="manoeuvreTypes.reverseRight"
          [competency]="competencies.observationFault"
          index="0"
        ></manoeuvre-competency-adi-part2>
      </ion-col>
      <ion-col class="manoeuvre-competencies-container" size="8" *ngIf="asyncData1.manoeuvres.forwardPark?.selected">
        <manoeuvre-competency-adi-part2
          [manoeuvre]="manoeuvreTypes.forwardPark"
          [competency]="competencies.controlFault"
          [attr.id]="getId(manoeuvreTypes.forwardPark, competencies.controlFault, 1)"
          index="0"
        ></manoeuvre-competency-adi-part2>
        <manoeuvre-competency-adi-part2
          class="second"
          [manoeuvre]="manoeuvreTypes.forwardPark"
          [competency]="competencies.observationFault"
          [attr.id]="getId(manoeuvreTypes.forwardPark, competencies.observationFault, 1)"
          index="0"
        ></manoeuvre-competency-adi-part2>
      </ion-col>
      <ion-col
        class="manoeuvre-competencies-container"
        size="8"
        *ngIf="asyncData1.manoeuvres.reverseParkCarpark?.selected"
      >
        <manoeuvre-competency-adi-part2
          [manoeuvre]="manoeuvreTypes.reverseParkCarpark"
          [competency]="competencies.controlFault"
          [attr.id]="getId(manoeuvreTypes.reverseParkCarpark, competencies.controlFault, 1)"
          index="0"
        ></manoeuvre-competency-adi-part2>
        <manoeuvre-competency-adi-part2
          class="second"
          [manoeuvre]="manoeuvreTypes.reverseParkCarpark"
          [competency]="competencies.observationFault"
          [attr.id]="getId(manoeuvreTypes.reverseParkCarpark, competencies.observationFault, 1)"
          index="0"
        ></manoeuvre-competency-adi-part2>
      </ion-col>
      <ion-col
        class="manoeuvre-competencies-container"
        size="8"
        *ngIf="asyncData1.manoeuvres.reverseParkRoad?.selected"
      >
        <manoeuvre-competency-adi-part2
          [manoeuvre]="manoeuvreTypes.reverseParkRoad"
          [competency]="competencies.controlFault"
          [attr.id]="getId(manoeuvreTypes.reverseParkRoad, competencies.controlFault, 1)"
          index="0"
        ></manoeuvre-competency-adi-part2>
        <manoeuvre-competency-adi-part2
          class="second"
          [manoeuvre]="manoeuvreTypes.reverseParkRoad"
          [competency]="competencies.observationFault"
          [attr.id]="getId(manoeuvreTypes.reverseParkRoad, competencies.observationFault, 1)"
          index="0"
        ></manoeuvre-competency-adi-part2>
      </ion-col>
    </ion-row>
  </ion-grid>
</ng-container>
