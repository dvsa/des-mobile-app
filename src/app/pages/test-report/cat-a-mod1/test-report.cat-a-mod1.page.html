<ion-header>
  <ion-toolbar
    [ngClass]="{
      'no-internal-padding': true,
      'practice-theme': isEndToEndPracticeMode,
      'toolbar-no-padding': isExitSAMBannerActivated,
      'ion-no-padding-important': isEndToEndPracticeMode
    }"
    mode="ios">
    <test-flow-header
      class="display-flex flex-direction-column"
      [pageName]="'test-report-page-cat-mod1'"
      [shouldShowGenericEndTest]="true"
      [shouldShowEndTestLink]="false"
      [shouldShowEscapeFromSamButton]="!isRekey && !isDelegated"
      [isPracticeMode]="isEndToEndPracticeMode"
      (exitSamUsed)="onUsedExitSam()"
      [isExitSAMActivated]="isExitSAMBannerActivated"
      (setupLeaveSubscription)="setupEscapeSAMLeaveSubscription()"
      (setupResumeSubscription)="setupEscapeSAMResumeSubscription()"
      (endTestButtonClicked)="onEndTestClick()"
      (onExitSAMActivatedChanged)="isSamActivatedChanged($event)">
      Test report - {{candidateUntitledName}}
    </test-flow-header>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-no-padding" [ngClass]="{'overflow': !isDelegated}" force-overscroll="false">
    <test-report-toolbar
    [category]="category"
    [testData]="testData()"
    [isDangerousMode]="isDangerousMode()"
    [isSeriousMode]="isSeriousMode()"
    [isRemoveFaultMode]="isRemoveFaultMode()"
  ></test-report-toolbar>
  <ion-grid
    class="grid-layout"
    [ngClass]="{
      'remove-mode': isRemoveFaultMode(),
      'add-mode': !isRemoveFaultMode(),
      'fault-mode': !isSeriousMode() && !isDangerousMode(),
      'serious-mode': isSeriousMode(),
      'dangerous-mode': isDangerousMode()
    }"
  >
    <ion-row class="first-row-adjust">
      <!-- Column 1-->
      <ion-col size="32">
        <ion-row>
          <ion-col class="ion-no-padding">
            <span class="section-header"></span>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <single-fault-competency [competency]="singleFaultCompetencyNames.useOfStand"></single-fault-competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <single-fault-competency [competency]="singleFaultCompetencyNames.manualHandling"></single-fault-competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <single-fault-competency [competency]="singleFaultCompetencyNames.slalom"></single-fault-competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <single-fault-competency [competency]="singleFaultCompetencyNames.slowControl"></single-fault-competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <single-fault-competency [competency]="singleFaultCompetencyNames.uTurn"></single-fault-competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <single-fault-competency [competency]="singleFaultCompetencyNames.controlledStop"></single-fault-competency>
          </ion-col>
        </ion-row>
      </ion-col>
      <!-- Column 2-->
      <ion-col size="32">
        <ion-col class="ion-no-padding">
          <span class="section-header"></span>
        </ion-col>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.precautions"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col class="ion-no-padding">
            <div class="dark-divider"></div>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col class="ion-no-padding">
            <h2 class="section-header">Move away</h2>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.moveOffSafety"></competency>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <competency [competency]="competencies.moveOffControl"></competency>
          </ion-col>
        </ion-row>
      </ion-col>
      <!-- Column 3-->
      <ion-col size="32">
        <ion-row>
          <ion-col class="ion-no-padding">
            <span class="section-header"></span>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <eta [eta]="eta.verbal"></eta>
          </ion-col>
          <ion-col>
            <eta [eta]="eta.physical"></eta>
          </ion-col>
        </ion-row>
      </ion-col>
    </ion-row>
    <speed-check-header></speed-check-header>
    <speed-check
      [competency]="competencies.speedCheckEmergency"
      [pairedCompetency]="singleFaultCompetencyNames.emergencyStop"
    >
    </speed-check>
    <speed-check
      [competency]="competencies.speedCheckAvoidance"
      [pairedCompetency]="singleFaultCompetencyNames.avoidance"
    >
    </speed-check>
  </ion-grid>
  <div
    class="report-overlay report-overlay-modal"
    [class.contract]="isSeriousMode() || isDangerousMode()"
    [class.show-overlay]="displayOverlay"
  ></div>
  <div
    class="report-overlay report-overlay-remove"
    [class.contract]="isSeriousMode() || isDangerousMode()"
    [class.show-overlay]="isRemoveFaultMode()"
  ></div>
</ion-content>
