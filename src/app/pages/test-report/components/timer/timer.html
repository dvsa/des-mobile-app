@if (showStartTimerButton) {
  <ion-button
    tappable="true"
    strong="true"
    fill="clear"
    id="start-timer-button"
    (click)="toggleTimer()"
    >
    <ion-text class="white-text des-header-style-3">Start timer</ion-text>
  </ion-button>
}
@if (!showStartTimerButton) {
  <div
    id="timer-text"
    tappable="true"
    (click)="toggleTimer()"
  [ngClass]="{
    'paused': isPaused
  }"
    >
    {{ timerString }}
  </div>
}
