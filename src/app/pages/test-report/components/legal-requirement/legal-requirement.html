<competency-button
  id="legal-requirements-button-{{ formatID() }}"
  class="legal-button"
  (onTap)="toggleLegalRequirement()"
  (onPress)="toggleLegalRequirement()"
  [allowRipple]="false"
  [disabled]="disabled"
  [ngClass]="{
    'complete': ticked,
    'disabled': disabled
  }"
>
  <div id="legal-requirements-tick-{{ formatID() }}" class="tickwrapper">
    <tick-indicator [ticked]="ticked"></tick-indicator>
  </div>
  <div id="legal-requirements-label-{{ formatID() }}" [ngClass]="getLegalRequirementClass()">
    <span class="competency-label">{{ label }}</span>
  </div>
</competency-button>
