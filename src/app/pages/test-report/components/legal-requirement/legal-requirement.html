<competency-button
  id="legal-requirements-button-{{ label }}{{ isNormalStart2() ? '2' : ''}}"
  class="legal-button"
  [onTap]="toggleLegalRequirement"
  [onPress]="toggleLegalRequirement"
  [ripple]="false"
  [disabled]="disabled"
  [ngClass]="{
    'complete': ticked,
    'disabled': disabled
  }"
>
  <div id="legal-requirements-tick-{{ label }}{{ isNormalStart2() ? '2' : ''}}" class="tickwrapper">
    <tick-indicator [ticked]="ticked"></tick-indicator>
  </div>
  <div id="legal-requirements-label-{{ label }}{{ isNormalStart2() ? '2' : ''}}" [ngClass]="getLegalRequirementClass()">
    <span class="competency-label">{{ label }}</span>
  </div>
</competency-button>
