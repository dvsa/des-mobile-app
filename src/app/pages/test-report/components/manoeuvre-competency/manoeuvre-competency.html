<competency-button
  [buttonId]="`manoeuvre-competency-button-${ label }`"
  class="manoeuvre-competency-button"
  (onTap)="addOrRemoveFault(isDelegated)"
  (onPress)="addOrRemoveFault(true)"
  [ngClass]="{
    'fault': hasDrivingFault(),
    'serious-fault': hasSeriousFault(),
    'dangerous-fault': hasDangerousFault()
  }"
>
  <driving-faults-badge
    id="manoeuvre-competency-driving-fault-{{ label }}"
    class="driving-faults"
    [count]="hasDrivingFault()"
  ></driving-faults-badge>

  <span id="manoeuvre-competency-label-{{ label }}" class="competency-label">{{ label }}</span>

  <div class="fault-wrapper">
    <serious-fault-badge
      id="manoeuvre-competency-serious-fault-{{ label }}"
      [showBadge]="hasSeriousFault()"
    ></serious-fault-badge>
    <dangerous-fault-badge
      id="manoeuvre-competency-dangerous-fault-{{ label }}"
      [showBadge]="hasDangerousFault()"
    ></dangerous-fault-badge>
  </div>
</competency-button>
