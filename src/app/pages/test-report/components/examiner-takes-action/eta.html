<competency-button
  class="eta-button"
  (onTap)="toggleETA()"
  (onPress)="toggleETA()"
  [allowRipple]="false"
  [ngClass]="{
    'complete': actionTaken()
  }"
>
  <div class="label">
    <span id="eta-label-{{ label() }}" class="competency-label"
      >{{ label() }}</span
    >
  </div>
</competency-button>
