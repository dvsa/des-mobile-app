<ion-grid>
  <ion-row class="tr-standard-text">{{ question }}</ion-row>
  <ion-row class="ion-padding-top">
    <ion-radio-group
      class="display-flex radio-group-width"
      [value]="answer"
      (ionChange)="valueChanged($event.detail.value)">
      <ion-col>
        <ion-radio
          class="gds-refactor-radio"
          [ngClass]="errorHighlighting()"
          labelPlacement="end"
          [id]="card + '-' + questionNumber + 'assessment-input-0'"
          [value]="0">
          <label
            class="radio-label"
            [id]="card + '-' + questionNumber + 'assessment-input-0-yes'">
            0
          </label>
        </ion-radio>
      </ion-col>
      <ion-col>
        <ion-radio
          class="gds-refactor-radio"
          [ngClass]="errorHighlighting()"
          labelPlacement="end"
          [id]="card + '-' + questionNumber + 'assessment-input-1'"
          [value]="1">
          <label
            class="radio-label"
            [id]="card + '-' + questionNumber + 'assessment-input-1-yes'">
            1
          </label>
        </ion-radio>
      </ion-col>
      <ion-col>
        <ion-radio
          class="gds-refactor-radio"
          [ngClass]="errorHighlighting()"
          labelPlacement="end"
          [id]="card + '-' + questionNumber + 'assessment-input-2'"
          [value]="2">
          <label
            class="radio-label"
            [id]="card + '-' + questionNumber + 'assessment-input-2-yes'">
            2
          </label>
        </ion-radio>
      </ion-col>
      <ion-col>
        <ion-radio
          class="gds-refactor-radio"
          [ngClass]="errorHighlighting()"
          labelPlacement="end"
          [id]="card + '-' + questionNumber + 'assessment-input-3'"
          [value]="3">
          <label
            class="radio-label"
            [id]="card + '-' + questionNumber + 'assessment-input-3-yes'">
            3
          </label>
        </ion-radio>
      </ion-col>
    </ion-radio-group>
  </ion-row>
  <ion-row *ngIf="hasBeenMissed()">
    <div
      class="validation-text"
      [class.ng-invalid]="true"
      [id]="card + '-' + questionNumber + 'assessment-validation-text'"
    >
      Select a score for this competency
    </div>
  </ion-row>
</ion-grid>
