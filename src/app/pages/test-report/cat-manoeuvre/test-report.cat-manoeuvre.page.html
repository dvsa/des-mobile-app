<ion-header>
  <ion-toolbar
    [ngClass]="{
      'no-internal-padding': true,
      'practice-theme': isEndToEndPracticeMode,
      'toolbar-no-padding': isExitSAMBannerActivated,
      'ion-no-padding-important': isEndToEndPracticeMode
    }"
    mode="ios">
    <test-flow-header
      class="display-flex flex-direction-column"
      [pageName]="'test-report-page-cat-manoeuvre'"
      [shouldShowGenericEndTest]="true"
      [shouldShowEndTestLink]="false"
      [shouldShowEscapeFromSamButton]="!isRekey && !isDelegated"
      [isPracticeMode]="isEndToEndPracticeMode"
      (exitSamUsed)="onUsedExitSam()"
      [isExitSAMActivated]="isExitSAMBannerActivated"
      (setupLeaveSubscription)="setupEscapeSAMLeaveSubscription()"
      (setupResumeSubscription)="setupEscapeSAMResumeSubscription()"
      (endTestButtonClicked)="onEndTestClick()"
      (onExitSAMActivatedChanged)="isSamActivatedChanged($event)">
      Test report - {{candidateUntitledName}}
    </test-flow-header>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-no-padding" [ngClass]="{'overflow': !isDelegated}" force-overscroll="false">
  <test-report-toolbar
    [category]="category"
    [testData]="testData()"
    [isDangerousMode]="isDangerousMode()"
    [isSeriousMode]="isSeriousMode()"
    [showDrivingFaultCounter]="false">
  </test-report-toolbar>
  <ion-grid
    class="grid-layout"
    [ngClass]="{
      'remove-mode': isRemoveFaultMode(),
      'add-mode': !isRemoveFaultMode(),
      'fault-mode': !isSeriousMode() && !isDangerousMode(),
      'serious-mode': isSeriousMode(),
      'dangerous-mode': isDangerousMode()
    }"
  >
    <ion-row class="first-row-adjust">
      <!-- Column 1-->
      <ion-col size="44">
        <ion-row>
          <ion-col>
            <h2 class="section-header">Reverse manoeuvre</h2>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-row>
            <ion-col class="ion-no-padding padding-bottom">
              <competency-button
                class="uncouple-recouple-toggle"
                (onTap)="toggleReverseManoeuvre()"
                [allowRipple]="false"
                [ngClass]="{
                 'checked': selectedReverseManoeuvre()
                  }"
              >
                <span class="tickwrapper">
                  <tick-indicator [ticked]="selectedReverseManoeuvre()"> </tick-indicator>
                </span>
              </competency-button>
            </ion-col>
          </ion-row>
        </ion-row>
        <ion-row>
          <ion-col class="reverse-manoeuvre-competencies-container-column">
            <reverse-manoeuvres
              [attr.id]="getId(manoeuvreTypes.reverseManoeuvre, manoeuvreCompetencies.observationFault)"
              [manoeuvre]="manoeuvreTypes.reverseManoeuvre"
              [competency]="manoeuvreCompetencies.controlFault"
              (competencyClicked)="competencyClick()"
            >
            </reverse-manoeuvres>
            <reverse-manoeuvres
              [attr.id]="getId(manoeuvreTypes.reverseManoeuvre, manoeuvreCompetencies.observationFault)"
              [manoeuvre]="manoeuvreTypes.reverseManoeuvre"
              [competency]="manoeuvreCompetencies.observationFault"
              (competencyClicked)="competencyClick()"
            >
            </reverse-manoeuvres>
          </ion-col>
        </ion-row>
        <div *ngIf="showUncoupleRecouple()">
          <ion-row>
            <ion-col class="padding-top-18 only-top-padding">
              <div class="dark-divider"></div>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col class="ion-no-padding">
              <h2 class="section-header">Vehicle with trailer</h2>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col class="ion-no-padding">
              <uncouple-recouple
                [category]="category"
                [buttonFloatAbove]="true"
                [disableDrivingFaults]="true"
                (competencyClicked)="competencyClick()"
              >
              </uncouple-recouple>
            </ion-col>
          </ion-row>
        </div>
      </ion-col>
      <!-- Column 2-->
      <ion-col size="6"></ion-col>
      <!-- Column 3-->
      <ion-col size="44">
        <ion-row>
          <ion-col>
            <span>
              <reverse-diagram-link
                [isPracticeMode]="isEndToEndPracticeMode"
            ></reverse-diagram-link>
            </span>
          </ion-col>
        </ion-row>
        <br />
        <ion-row>
          <ion-col>
            <div class="dark-divider"></div>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <eta [eta]="eta.verbal"></eta>
          </ion-col>
          <ion-col>
            <eta [eta]="eta.physical"></eta>
          </ion-col>
        </ion-row>
      </ion-col>
    </ion-row>
  </ion-grid>
  <div
    class="report-overlay report-overlay-modal"
    [class.contract]="isSeriousMode() || isDangerousMode()"
    [class.show-overlay]="displayOverlay"
  ></div>
  <div
    class="report-overlay report-overlay-remove"
    [class.contract]="isSeriousMode() || isDangerousMode()"
    [class.show-overlay]="isRemoveFaultMode()"
  ></div>
</ion-content>
