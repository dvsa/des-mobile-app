<ion-row class="mes-full-width-card">
  <ion-col size="41"></ion-col>
  <ion-col size="31" class="ion-no-padding align-col-right">
    <ion-text id="total-label" class="des-header-style-2">{{label}}</ion-text>
  </ion-col>
  <ion-col size="8" class="ion-no-padding align-col-right">
    <ion-text id="score-value" class="des-header-style-2">{{score || 0}}</ion-text>
  </ion-col>
  <ion-col size="4" class="ion-no-padding">
    @if (displayPercentage) {
      <ion-text id="percentage-label" class="des-header-style-2">%</ion-text>
    }
  </ion-col>
</ion-row>
