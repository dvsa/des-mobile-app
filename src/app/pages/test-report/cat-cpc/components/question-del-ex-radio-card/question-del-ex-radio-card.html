<ion-card>
  <question-title [question]="question"></question-title>
  <ion-card-content class="question-card-spacing">
    <ion-grid>
      <ion-row [formGroup]="formGroup">
        <div class="validation-bar" [class.ng-invalid]="invalid"></div>
        <ion-radio-group
          class="display-flex width-100-percent"
          formControlName="cpcQuestion{{questionNumber}}ResultCtrl"
          [value]="formControl.value"
          (ionChange)="questionScoreChanged($event.detail.value)">
          <ion-col size="2"></ion-col>
          <ion-col *ngFor="let answers of answerArray">
            <ion-radio
              class="gds-refactor-radio"
              [class.ng-invalid]="invalid"
              id="question{{questionNumber}}answer{{answers}}"
              labelPlacement="end"
              value="{{answers}}">
              <label class="radio-label" id="question{{questionNumber}}answer{{answers}}-label">{{answers}}%</label>
            </ion-radio>
          </ion-col>
        </ion-radio-group>
      </ion-row>
      <ion-row class="validation-message-row ion-align-items-center" *ngIf="invalid">
        <div class="validation-text" [class.ng-invalid]="invalid" id="question{{questionNumber}}-validation-text">
          Please select a score
        </div>
      </ion-row>
    </ion-grid>
  </ion-card-content>
</ion-card>
