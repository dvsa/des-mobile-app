<ion-header>
  <ion-toolbar
    [ngClass]="{
      'no-internal-padding': true,
      'practice-theme': isEndToEndPracticeMode,
      'toolbar-no-padding': isExitSAMBannerActivated,
      'ion-no-padding-important': isEndToEndPracticeMode
    }"
    mode="ios">
    <test-flow-header
      class="display-flex flex-direction-column"
      [pageName]="'test-report-page-cat-cpc'"
      [shouldShowGenericEndTest]="true"
      [shouldShowEndTestLink]="false"
      [shouldShowBackButton]="isDelegated"
      [shouldShowEscapeFromSamButton]="!isRekey && !isDelegated"
      [isPracticeMode]="isEndToEndPracticeMode"
      (exitSamUsed)="onUsedExitSam()"
      [isExitSAMActivated]="isExitSAMBannerActivated"
      (setupLeaveSubscription)="setupEscapeSAMLeaveSubscription()"
      (setupResumeSubscription)="setupEscapeSAMResumeSubscription()"
      (endTestButtonClicked)="onEndTestClick()"
      (onExitSAMActivatedChanged)="isSamActivatedChanged($event)">
      Test report - {{candidateUntitledName}}
    </test-flow-header>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-no-padding">
  <module-assessment [combinationCode]="combinationCode()"></module-assessment>

  <div *ngIf="!isDelegated">
    <question-card
      *ngIf="pageNumber === 1"
      (answerPayload)="populateAnswer($event)"
      [question]="question1()"
      [questionNumber]="pageNumber"
    >
    </question-card>

    <question-card
      *ngIf="pageNumber === 2"
      (answerPayload)="populateAnswer($event)"
      [question]="question2()"
      [questionNumber]="pageNumber"
    >
    </question-card>

    <question-card
      *ngIf="pageNumber === 3"
      (answerPayload)="populateAnswer($event)"
      [question]="question3()"
      [questionNumber]="pageNumber"
    >
    </question-card>

    <question-card
      *ngIf="pageNumber === 4"
      (answerPayload)="populateAnswer($event)"
      [question]="question4()"
      [questionNumber]="pageNumber"
    >
    </question-card>

    <question-five-card
      *ngIf="pageNumber === 5"
      (answerPayload)="populateAnswer($event)"
      [question]="question5()"
    >
    </question-five-card>
  </div>

  <div *ngIf="isDelegated">
    <question-del-ex-radio-card
      *ngFor="let questionNum of [0,1,2,3,4]"
      [formGroup]="form"
      (questionScore)="populateScore($event)"
      [question]="questions()[questionNum]"
      [questionNumber]="questionNum"
    >
    </question-del-ex-radio-card>
  </div>
</ion-content>

<question-footer
  [questionNumber]="pageNumber"
  (questionPageChange)="questionPageChanged($event)"
  (testSummaryRequested)="onEndTestClick()"
  [isDelegated]="isDelegated"
  [formGroup]="form"
>
</question-footer>
