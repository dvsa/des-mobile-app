<ion-header>
  <practice-mode-options-bar *ngIf="isEndToEndPracticeMode || isPracticeMode"></practice-mode-options-bar>
  <ion-toolbar class="no-internal-padding"
               [ngClass]="{'toolbar-no-padding': isEndToEndPracticeMode || isExitSAMBannerActivated}" mode="ios">
    <test-flow-header
      class="display-flex flex-direction-column"
      [pageName]="'test-report-page-cat-cpc'"
      [shouldShowGenericEndTest]="true"
      [shouldShowEndTestLink]="false"
      [fixHeight]="true"
      [shouldShowBackButton]="isDelegated"
      [shouldShowEscapeFromSamButton]="!isRekey && !isDelegated"
      [isPracticeMode]="isEndToEndPracticeMode"
      (exitSamUsed)="onUsedExitSam()"
      [isExitSAMActivated]="isExitSAMBannerActivated"
      (setupLeaveSubscription)="setupEscapeSAMLeaveSubscription()"
      (setupResumeSubscription)="setupEscapeSAMResumeSubscription()"
      (endTestButtonClicked)="onEndTestClick()"
      (onExitSAMActivatedChanged)="isSamActivatedChanged($event)">
      Test report - {{pageState.candidateUntitledName$ | async}}
    </test-flow-header>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-no-padding">
  <module-assessment [combinationCode]="pageState.combinationCode$ | async"></module-assessment>

  <div *ngIf="!isDelegated">
    <question-card
      *ngIf="pageNumber === 1"
      (answerPayload)="populateAnswer($event)"
      [question]="pageState.question1$ | async"
      [questionNumber]="pageNumber"
    >
    </question-card>

    <question-card
      *ngIf="pageNumber === 2"
      (answerPayload)="populateAnswer($event)"
      [question]="pageState.question2$ | async"
      [questionNumber]="pageNumber"
    >
    </question-card>

    <question-card
      *ngIf="pageNumber === 3"
      (answerPayload)="populateAnswer($event)"
      [question]="pageState.question3$ | async"
      [questionNumber]="pageNumber"
    >
    </question-card>

    <question-card
      *ngIf="pageNumber === 4"
      (answerPayload)="populateAnswer($event)"
      [question]="pageState.question4$ | async"
      [questionNumber]="pageNumber"
    >
    </question-card>

    <question-five-card
      *ngIf="pageNumber === 5"
      (answerPayload)="populateAnswer($event)"
      [question]="pageState.question5$ | async"
    >
    </question-five-card>
  </div>

  <div *ngIf="isDelegated">
    <question-del-ex-radio-card
      *ngFor="let number of [1,2,3,4,5]"
      [formGroup]="form"
      (questionScore)="populateScore($event)"
      [question]="pageState['question' + number + '$'] | async"
      [questionNumber]="number"
    >
    </question-del-ex-radio-card>
  </div>
</ion-content>

<question-footer
  [questionNumber]="pageNumber"
  (questionPageChange)="questionPageChanged($event)"
  (testSummaryRequested)="onEndTestClick()"
  [isDelegated]="isDelegated"
  [formGroup]="form"
>
</question-footer>
