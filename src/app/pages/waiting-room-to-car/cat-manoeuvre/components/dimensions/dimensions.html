<ion-row class="mes-component-row mes-row-separator mes-tall-row" id="dimensions-card">
  <ion-col class="component-label ion-align-self-center" size="32">
    <label id="dimensions-label">Dimensions</label>
  </ion-col>
  <ion-col class="ion-align-self-center mes-padding-left">
    <ion-row>
      <span class="mes-data">
        <span class="mes-data" [id]="'length-label' | formatToID : idPrefix">Length:</span>
        {{ vehicleLength }}
        <span class="mes-data">metres</span>
      </span>
    </ion-row>
    <ion-row>
      <span class="mes-data">
        <span class="mes-data" [id]="'width-label' | formatToID : idPrefix">Width:</span>
        {{ vehicleWidth }}
        <span class="mes-data">metres</span>
      </span>
    </ion-row>
    <ion-row>
      <span class="mes-data">
        <span class="mes-data" [id]="'height-label' | formatToID : idPrefix">Height:</span>
        {{ vehicleHeight }}
        <span class="mes-data">metres</span>
      </span>
    </ion-row>
    <ion-row>
      <span class="mes-data">
        <span class="mes-data bold" [id]="'width-label' | formatToID : idPrefix">Seats:</span>
        {{ numberOfSeats }}
      </span>
    </ion-row>
  </ion-col>
</ion-row>
