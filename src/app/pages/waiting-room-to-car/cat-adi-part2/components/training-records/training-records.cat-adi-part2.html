<ion-row class="mes-validated-row mes-row-separator" id="training-record-card" [formGroup]="formGroup">
  <div class="validation-bar" [class.ng-invalid]="invalid"></div>
  <ion-col class="component-label ion-align-self-center" size="32">
    <label>Training records</label>
  </ion-col>
  <ion-col class="ion-align-self-center ion-padding-start">
    <ion-row class="spacing-row"></ion-row>
    <ion-row>
      <ion-radio-group
        class="display-flex radio-group-width"
        formControlName="trainingRecordCtrl"
        (ionChange)="trainingRecordOutcomeChanged($event.target.value)">
        <ion-col size="40">
          <ion-radio
            id="training-record-yes"
            class="gds-refactor-radio"
            [class.ng-invalid]="invalid"
            labelPlacement="end"
            [value]="true">
            <label class="radio-label" id="training-record-yes-label">
              Yes
            </label>
          </ion-radio>
        </ion-col>
        <ion-col size="16"></ion-col>
        <ion-col>
          <ion-radio
            id="training-record-no"
            class="gds-refactor-radio"
            [class.ng-invalid]="invalid"
            labelPlacement="end"
            [value]="false">
            <label class="radio-label" id="training-record-no-label">
              No
            </label>
          </ion-radio>
        </ion-col>
      </ion-radio-group>
    </ion-row>
    <ion-row class="validation-message-row ion-align-items-center">
      <div
        class="validation-text"
        [class.ng-invalid]="invalid"
        id="waiting-room-to-car-training-records-validation-text"
      >
        Select the training records outcome
      </div>
    </ion-row>
  </ion-col>
</ion-row>
