<ion-header>
  <ion-toolbar
    [ngClass]="{
      'no-internal-padding': true,
      'practice-theme': isEndToEndPracticeMode,
      'toolbar-no-padding': isExitSAMBannerActivated,
      'ion-no-padding-important': isEndToEndPracticeMode
    }"
    mode="ios">
    <test-flow-header
      class="display-flex flex-direction-column"
      [testCategory]="category()"
      [pageName]="'waiting-room-to-car-page-adi3'"
      [shouldShowEscapeFromSamButton]="!isRekey && !isDelegated"
      [isPracticeMode]="isEndToEndPracticeMode"
      (exitSamUsed)="onUsedExitSam()"
      [isExitSAMActivated]="isExitSAMBannerActivated"
      [shouldAuthenticateOnTestEnd]="false"
      (setupLeaveSubscription)="setupEscapeSAMLeaveSubscription()"
      (setupResumeSubscription)="setupEscapeSAMResumeSubscription()"
      (onExitSAMActivatedChanged)="isSamActivatedChanged($event)"
      (endTestButtonClicked)="abortMOTCall(MOTAbortedMethod.END_TEST)">
      {{ candidateName() }}
    </test-flow-header>
  </ion-toolbar>
</ion-header>

<ion-content [class.hidden]="failedMOTModalCurrentlyOpen" force-overscroll="false">
  @if (!isEndToEndPracticeMode) {
    <offline-banner [isOffline]="isOffline()"></offline-banner>
  }
  <div>
    <form (ngSubmit)="onSubmit()" [formGroup]="form">
      <ion-grid>
        <ion-row class="ion-no-padding">
          <ion-col class="ion-no-padding">
            <vehicle-registration
              (alternateEvidenceChange)="getMOTEvidenceProvided($event)"
              (noMotData)="noMotData($event)"
              (vehicleRegistrationChanged)="vehicleRegistrationChanged($event.VRN, $event.isAmended)"
              (vrnSearchListUpdate)="updateVRNSearchList($event)"
              (motDetailsUpdate)="motDetailsChanged($event)"
              (motFailedModalToggled)="motFailedModalOpened($event)"
              (motButtonPressed)="motSearchButtonPressed()"
              (failedMOTModalOutcome)="motFailedModalOutcome($event)"
              (motCallAborted)="abortMOTCall($event)"
              (motSearchingStatusChange)="motSearchingStatusChanged($event)"
              [formGroup]="form"
              [isPracticeMode]="isEndToEndPracticeMode"
              [vehicleRegistration]="registrationNumber()"
              [shouldHideMOTButton]="isRekey"
              [abortSubject]="abortSubject"
            >
            </vehicle-registration>

            @if (motEvidenceProvided() === false) {
              <ion-row>
                <mot-no-evidence-confirmation [cancelFn]="motNoEvidenceCancelled" [nextPageOnFail]="getDebriefPage()">
                </mot-no-evidence-confirmation>
              </ion-row>
            }

            <safety-recall>
            </safety-recall>

            <div [hidden]="motEvidenceProvided() === false" class="ion-no-padding">

              <test-category [testCategory]="category()"></test-category>

              <dual-controls
                (dualControlsChange)="dualControlsOutcomeToggled($event)"
                [dualControls]="dualControls()"
                [formGroup]="form"
              >
              </dual-controls>

              <transmission
                (transmissionChange)="transmissionChanged($event)"
                [formGroup]="form"
                [transmission]="transmission()"
              >
              </transmission>

              @if (notSC(category())) {
                <trainee-licence
                  (traineeLicenceChange)="traineeLicenceChanged($event)"
                  [formGroup]="form"
                  [traineeLicence]="pageState.traineeLicence$ | async"
                >
                </trainee-licence>
              }

              <ordit-trainer-cat-adi-part2
                (orditTrainedOutcomeChange)="orditTrainedOutcomeChanged($event)"
                [formGroup]="form"
                [notSC]="notSC(category())"
                [orditTrainedRadioChecked]="pageState.orditTrained$ | async"
              >
              </ordit-trainer-cat-adi-part2>

              <accompaniment-card-adi3
                (otherAccompanimentChange)="otherAccompanimentToggled()"
                (supervisorAccompanimentChange)="supervisorAccompanimentToggled()"
                (trainerAccompanimentChange)="trainerAccompanimentChanged()"
                [formGroup]="form"
                [otherAccompaniment]="otherAccompaniment()"
                [supervisorAccompaniment]="supervisorAccompaniment()"
                [trainerAccompaniment]="pageState.trainerAccompaniment$ | async"
              >
              </accompaniment-card-adi3>

              <trainer-registration-number-cat-adi-part2
                (trainerRegistrationChange)="trainerRegistrationNumberChanged($event)"
                [formGroup]="form"
                [trainerRegistration]="pageState.trainerRegistrationNumber$ | async"
                [trainerLabel]="notSC(category()) ? `Sponsor's PRN (optional)` : 'Trainer PRN (optional)'"
              >
              </trainer-registration-number-cat-adi-part2>
            </div>
          </ion-col>
        </ion-row>
      </ion-grid>
    </form>
  </div>
</ion-content>

<ion-footer [class.hidden]="failedMOTModalCurrentlyOpen">
  <ion-row
    [hidden]="eyesightTestFailed() || motEvidenceProvided() === false"
    class="mes-full-width-card box-shadow flex-center">
    <ion-col class="ion-text-center width-100" size="43">
      <ion-button
        (click)="onViewTestCentreJournal()"
        class="mes-grey-button"
        id="view-test-centre-journal-button"
        shape="round"
      >
        <ion-text class="des-header-style-3">View test centre journal</ion-text>
      </ion-button>
    </ion-col>
    <ion-col size="2"></ion-col>
    <ion-col class="ion-text-center width-100" size="43">
      <ion-button
        (click)="onSubmit()"
        class="mes-primary-button"
        id="continue-to-test-report-button"
        shape="round"
      >
        <ion-text class="des-header-style-3">Continue to test report</ion-text>
      </ion-button>
    </ion-col>
  </ion-row>
</ion-footer>
