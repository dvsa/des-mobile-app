<ion-row class="mes-validated-row mes-row-separator mes-narrow-row" id="dual-controls-card" [formGroup]="formGroup">
  <div class="validation-bar" [class.ng-invalid]="invalid"></div>
  <ion-col class="component-label ion-align-self-center" size="32">
    <label id="dual-controls-label">Dual controls</label>
  </ion-col>
  <ion-col class="ion-align-self-center ion-padding-start">
    <ion-row class="spacing-row"></ion-row>
    <ion-row>
      <ion-radio-group
        class="display-flex radio-group-width"
        formControlName="dualControlsCtrl"
        [value]="formControl.value"
        (ionChange)="dualControlsChanged($event.detail.value)">
        <ion-col size="40">
          <ion-radio
            class="gds-refactor-radio"
            [class.ng-invalid]="invalid"
            id="dual-controls-yes"
            labelPlacement="end"
            value="true">
            <label class="radio-label" id="dual-controls-yes-label">
              Yes
            </label>
          </ion-radio>
        </ion-col>
        <ion-col size="16"></ion-col>
        <ion-col>
          <ion-radio
            class="gds-refactor-radio"
            [class.ng-invalid]="invalid"
            id="dual-controls-no"
            value="false"
            labelPlacement="end">
            <label class="radio-label" id="dual-controls-no-label">
              No
            </label>
          </ion-radio>
        </ion-col>
      </ion-radio-group>
    </ion-row>
    <ion-row class="validation-message-row ion-align-items-center">
      <div class="validation-text" id="dual-controls-validation-text" [class.ng-invalid]="invalid">
        Select if dual controls were present
      </div>
    </ion-row>
  </ion-col>
</ion-row>
