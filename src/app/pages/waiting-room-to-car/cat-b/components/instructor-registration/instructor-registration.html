<ion-row class="mes-component-row mes-row-separator mes-narrow-row" id="instructor-registration-card"
         [formGroup]="formGroup">
  <ion-col class="component-label ion-align-self-center" size="32">
    <ion-row>
      <label id="instructor-registration-number-title">Instructor registration number (optional)</label>
    </ion-row>
    <ion-row class="top-align-padding">
      <ion-text
        class="mes-data ion-align-content-center explainer">Instructor reference must be 7 digits or fewer
      </ion-text>
    </ion-row>
  </ion-col>
  <ion-col class="top-input-padding mes-padding-left">
    <ion-row>
      <ion-col size="32">
        <ion-input
          inputmode="numeric"
          type="number"
          aria-labelledby="instructor-registration-number-title"
          id="instructor-registration"
          class="ion-input-styling increase-width"
          formControlName="instructorRegistration"
          (ionChange)="instructorRegistrationChanged($event.target.value)"
          [maskitoElement]="getMaskPredicate()"
          [maskito]="digitsOnlyMask"
        >
        </ion-input>
      </ion-col>
    </ion-row>
  </ion-col>
</ion-row>
