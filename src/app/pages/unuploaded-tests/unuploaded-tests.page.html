<ion-header>
  <ion-toolbar mode="ios">
    <ion-buttons slot="end">
      <ion-button
        class="white-text"
        id="unuploaded-tests-return-to-dashboard-btn"
        (click)="goToDashboard()">
        <ion-icon class="close-btn" name="close-outline"></ion-icon>
        <ion-label class="close-btn">Close</ion-label>
      </ion-button>
    </ion-buttons>
    <ion-title id="unsubmitted-tests-page-title" role="heading" aria-level="1">Incomplete tests</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content
  class="ion-padding"
  *ngIf="{
   slots: pageState.unSubmittedTestSlots$ | async
} as state"
>
  <div>
    <profile-header
      [employeeId]="pageState.employeeId$ | async"
      [name]="pageState.employeeName$ | async"
      [role]="pageState.role$ | async"
    >
    </profile-header>
  </div>

  <div class="header-divider"></div>

  <ion-text class="des-header-style-2">
    You have {{ state.slots?.length || 0 }} incomplete {{ getTestsText(state.slots?.length) }} (over 1 day old)
  </ion-text>

  <test-slot
    *ngFor="let slot of state.slots; let count = count;"
    [slots]="pageState.unSubmittedTestSlotData$ | async"
    [slot]="slot?.slotData"
    [isPortrait]="orientationMonitorProvider.isPortraitMode$ | async"
    [isUnSubmittedTestSlotView]="true"
  >
  </test-slot>
</ion-content>
