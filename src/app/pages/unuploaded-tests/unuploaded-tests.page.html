<ion-header>
  <ion-toolbar mode="ios">
    <ion-buttons slot="end">
      <ion-button
        class="white-text"
        id="unuploaded-tests-return-to-dashboard-btn"
        (click)="goToDashboard()">
        <ion-icon class="close-btn" name="close-outline"></ion-icon>
        <ion-label class="close-btn">Close</ion-label>
      </ion-button>
    </ion-buttons>
    <ion-title id="unsubmitted-tests-page-title" role="heading" aria-level="1">Incomplete tests</ion-title>
  </ion-toolbar>
</ion-header>

@if (slots(); as incompleteSlots) {
  <ion-content
    class="ion-padding"
    >
    <div>
      <profile-header
        [employeeId]="employeeId()"
        [name]="employeeName()"
        [role]="role()"
        >
      </profile-header>
    </div>
    <div class="header-divider"></div>
    <ion-text class="des-header-style-2">
      You have {{ incompleteSlots.length }} incomplete {{ getTestsText(incompleteSlots.length) }} (over 1 day old)
    </ion-text>
    @for (slot of incompleteSlots; track slot) {
      <test-slot
        [slots]="slotData()"
        [slot]="slot?.slotData"
        [isPortrait]="isPortrait()"
        [isUnSubmittedTestSlotView]="true"
        >
      </test-slot>
    }
  </ion-content>
}
