<ion-row class="ion-margin-start ion-padding-top ion-padding-bottom ion-padding-start">
  <ion-col class="ion-align-self-center" size="30">
    <label id="test-start-end-times-label">Test start - end time</label>
  </ion-col>
  <ion-col class="display-flex ion-align-items-center" size="20">
    <datetime-input
      [initialValue]="startTime"
      (onDataPicked)="timeChanged($event)"
      [control]="'start-time'"
      [pickerId]="'time-picker-start'"
      [inputId]="'time-input-start'"
      [maxValue]="maxTime"
      [showClearButton]="false"
      [disabled]="false"
      [displayType]="timeDisplayType"
      [emitButtonEvents]="true"
      (customButtonEvent)="handleEvents($event.data, $event.buttonType, PassFinalisationAmendTimeType.StartTime)"
    >
    </datetime-input>
  </ion-col>

  <ion-col class="centre-col" size="10">
    <label class="to-label" id="to-label">-</label>
  </ion-col>

  <ion-col class="display-flex ion-align-items-center" size="20">
    <datetime-input
      [initialValue]="endTime"
      (onDataPicked)="timeChanged($event)"
      [control]="'end-time'"
      [pickerId]="'time-picker-end'"
      [inputId]="'time-input-end'"
      [minValue]="minTime"
      [showClearButton]="false"
      [disabled]="false"
      [displayType]="timeDisplayType"
      [emitButtonEvents]="true"
      (customButtonEvent)="handleEvents($event.data, $event.buttonType, PassFinalisationAmendTimeType.EndTime)"
    >
    </datetime-input>
  </ion-col>
</ion-row>
