<ion-row class="mes-validated-row mes-row-separator" id="provisional-license-card">
  <div class="validation-bar" [class.ng-invalid]="isInvalid()"></div>
  <ion-col class="component-label ion-align-self-center" size="32">
    <label id="license-provided-label">{{ licenseReceivedLabel }}</label>
  </ion-col>
  <ion-col class="ion-align-self-center mes-padding-left">
    <ion-row class="spacing-row"></ion-row>
    <ion-row
      class="display-flex direction-column"
      [formGroup]="form">
      <ion-radio-group
        class="display-flex radio-group-width"
        formControlName="provisionalLicenseProvidedCtrl"
        [value]="formControl.value"
        (ionChange)="licenseProvidedChanged($event.detail.value)">
        <ion-col size="40">
          <ion-radio
            class="gds-refactor-radio"
            id="license-received"
            [class.ng-invalid]="isInvalid()"
            labelPlacement="end"
            value="yes">
            <label class="radio-label" id="prov-licence-received-yes-label">
              Yes
            </label>
          </ion-radio>
        </ion-col>
        <ion-col></ion-col>
        <ion-col size="40">
          <ion-radio
            class="gds-refactor-radio"
            id="license-not-received"
            [class.ng-invalid]="isInvalid()"
            value="no"
            labelPlacement="end">
            <label class="radio-label" id="prov-licence-received-no-label">
              No
            </label>
          </ion-radio>
        </ion-col>
      </ion-radio-group>
    </ion-row>
    <ion-row class="validation-message-row ion-align-items-center">
      <div class="validation-text" [class.ng-invalid]="isInvalid()" id="licence-provided-validation-text">
        Select a response
      </div>
    </ion-row>
  </ion-col>
</ion-row>
