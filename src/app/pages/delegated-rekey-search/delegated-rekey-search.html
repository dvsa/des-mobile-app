<ion-header>
  <ion-toolbar>
    <ion-buttons id="delegated-rekey-search-back-button" slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title role="heading" aria-level="1" id="delegated-rekey-search-page-title">
      Search test rekey backlog
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content force-overscroll="false">
  <div class="search-inputs box-spacing" [formGroup]="delegatedRekeyForm">
    <tabs>
      <tab [tabTitle]="'Rekey backlog'" id="tab-search-rekey">
        <ion-grid>
          <ion-row>
            <ion-col class="ion-align-self-center" size="32">
              <label id="delegated-rekey-search-app-ref-label">Application reference</label>
            </ion-col>
            <ion-col class="display-flex ion-align-items-center" size="38">
              <ion-input
                placeholder="Application reference"
                id="delegated-rekey-search-application-reference"
                type="text"
                formControlName="applicationReferenceInput"
                class="ion-input-styling custom-font-size"
                aria-labelledby="delegated-rekey-search-application-reference-label"
                [clearInput]="true"
                numbersOnly
                maxlength="11"
                [class.ng-invalid]="hasClickedSearch && applicationReferenceInvalid"
                (ionFocus)="setFocus('appRef')"
                (ionBlur)="setFocus(null)"
                [ngClass]="{'input-focus': focusedElement === 'appRef'}"
                [value]="applicationReference"
                (ionChange)="applicationReferenceChanged($event.target.value)"
              >
              </ion-input>
            </ion-col>
          </ion-row>

          <ion-row
            *ngIf="hasClickedSearch && applicationReferenceInvalid"
            class="validation-message-row ion-align-items-center"
          >
            <div
              class="ion-padding-left validation-text"
              [class.ng-invalid]="applicationReferenceInvalid"
              id="delegated-rekey-search-validation-text"
            >
              Please enter a valid application reference number (11 digits)
            </div>
          </ion-row>

          <ion-row class="ion-padding-top">
            <ion-button
              [disabled]="(pageState.isLoading$ | async)"
              class="mes-primary-button search-tests"
              id="delegated-rekey-search-search-tests-btn"
              (click)="searchTests()"
            >
              <ion-col></ion-col>
              <ion-col size="45" class="ion-justify-content-center display-flex">
                <ion-text id="delegated-rekey-search-advanced-search-button-text" class="des-header-style-3">
                  <ion-icon id="delegated-rekey-search-advanced-search-button-icon" class="search-icon" name="search"></ion-icon>
                  Search booked tests
                </ion-text>
              </ion-col>
              <ion-col class="display-flex">
                <ion-col class="ion-justify-content-end display-flex">
                  <ion-spinner
                    *ngIf="(pageState.isLoading$ | async)"
                    id="delegated-rekey-search-page-spinner"
                    name="bubbles">
                  </ion-spinner>
                </ion-col>
              </ion-col>
            </ion-button>
          </ion-row>
        </ion-grid>
      </tab>
    </tabs>

    <div [ngSwitch]="getSearchResultState(pageState.bookedTestSlot$ | async, pageState.rekeySearchErr$ | async, pageState.hasSearched$ | async)">
      <div *ngSwitchCase="SearchResultState.NO_RESULT" class="results-error">
        <p class="error-text" id="delegated-rekey-search-error-text-no-results">There were no results found for your search.</p>
        <p class="error-text" id="delegated-rekey-search-error-text-no-pls-try-again">Please check and try again.</p>
      </div>
      <div *ngSwitchCase="SearchResultState.ALREADY_SUBMITTED" class="results-error">
        <p class="error-text" id="delegated-rekey-search-error-text-already-submitted">
          You can't rekey this test as it has already been submitted.
        </p>
        <p class="error-text" id="delegated-rekey-search-error-text-try-again">Please check and try again.</p>
      </div>
      <p *ngSwitchCase="SearchResultState.HAS_RESULT" class="results-message">
        <test-slot
          [delegatedTest]="true"
          [isPortrait]="orientationMonitorProvider.isPortraitMode$ | async"
          [slot]="(pageState.bookedTestSlot$ | async)"
          [hasSlotChanged]="false"
          [hasSeenCandidateDetails]="true"
          [showLocation]="false"
          (cancelFutureTestModal)="clearAppRef()"
        >
        </test-slot>
      </p>
    </div>


  </div>
