<ion-list role="list">
  @for (slot of slots; track trackBySlotID($index, slot); let i = $index) {
    @switch (slotType(slot)) {
      @case ('personal') {
        <personal-commitment
          role="listitem"
          [hasSlotChanged]="slot?.hasSlotChanged"
          [personalCommitments]="slot?.personalCommitment"
          [showLocation]="showLocation(slot, slots[i - 1])"
          [slot]="slot?.slotData"
        >
        </personal-commitment>
      }
      @case ('activity') {
        <activity-slot
          role="listitem"
          [hasSlotChanged]="slot?.hasSlotChanged"
          [showLocation]="showLocation(slot, slots[i - 1])"
          [slot]="slot?.slotData"
        >
        </activity-slot>
      }
      @case ('empty') {
        <empty-slot
          role="listitem"
          [hasSlotChanged]="slot.hasSlotChanged"
          [isPortrait]="isPortrait"
          [showLocation]="showLocation(slot, slots[i - 1])"
          [slot]="slot.slotData"
        >
        </empty-slot>
      }
      @case ('test-slot') {
        <test-slot
          role="listitem"
          [delegatedTest]="false"
          [completedTestRecord]="findCompletedTest(slot.slotData)"
          [hasSeenCandidateDetails]="slot?.hasSeenCandidateDetails"
          [hasSlotChanged]="slot?.hasSlotChanged"
          [isPortrait]="isPortrait"
          [isTeamJournal]="isTeamJournal"
          [showLocation]="showLocation(slot, slots[i - 1])"
          [slot]="slot?.slotData"
          [slots]="getSlots()"
          [teamJournalCandidateResult]="false"
        >
        </test-slot>
      }
    }
  }
</ion-list>
