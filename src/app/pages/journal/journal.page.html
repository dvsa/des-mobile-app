<ion-header>
  <ion-toolbar mode="ios">
    <ion-title aria-level="1" role="heading" id="journal-page-title">Journal</ion-title>
    <ion-buttons id="back-button" slot="end" class="mes-padding-right">
      <ion-back-button
        text="Close"
        icon="close-outline"
        (click)="router.navigate(['DashboardPage'], {replaceUrl: true})" [defaultHref]="'DashboardPage'">
      </ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-no-padding">
  <offline-banner [isOffline]="isOffline()"></offline-banner>

  <incomplete-tests-banner></incomplete-tests-banner>

  <ion-refresher
    class="refresher-content refresher-refreshing-text height-500 display-flex ion-justify-content-center"
    [pullMax]="500" [pullMin]="70"
    (ionRefresh)="pullRefreshJournal($event)"
    slot="fixed">
    <ion-refresher-content
      class="refresher-content refresher-refreshing-text"
      pullingIcon="arrow-down"
      pullingText="Pull to refresh"
      refreshingSpinner="circles"
      refreshingText="Refreshing Journal..."
    >
    </ion-refresher-content>
  </ion-refresher>

  <ion-row class="padding-bottom">
    <ion-col class="display-flex justify-content-center padding-top">
      <refresh-button
        (refreshButtonClicked)="clickRefreshJournal()"
        [lastSyncTime]="lastRefreshedTime()"
        [isDisabled]="isLoading()"
      ></refresh-button>
    </ion-col>
    <ion-col size="55">
      <journal-navigation
        (nextDayClicked)="onNextDayClick()"
        (previousDayClicked)="onPreviousDayClick()"
        [canNavigateToNextDay]="canNavigateToNextDay()"
        [canNavigateToPreviousDay]="canNavigateToPreviousDay()"
        [isSelectedDateToday]="isSelectedDateToday()"
        [selectedDate]="selectedDate()"
      >
      </journal-navigation>
    </ion-col>
    <ion-col></ion-col>
  </ion-row>

  <vehicle-recalls-banner></vehicle-recalls-banner>

  @if (slots()?.length > 0) {
    <journal-slots
      [completedTests]="completedTests()"
      [isPortrait]="isPortrait()"
      [slots]="slots()">
    </journal-slots>
  } @else {
    <div class="no-results ion-text-center">
      <p>There is no journal data to display for this day</p>
    </div>
  }
</ion-content>
