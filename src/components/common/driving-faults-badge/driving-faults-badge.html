<div>
  @if (shouldDisplay()) {
    <div class="counter-background">
      <span aria-labelledby="drf-desc-{{competencyDisplayName}}"
            aria-hidden="true"
            class="count"
            id="{{competencyDisplayName}}-count">
        {{ count }}
      </span>
      <div
        id="drf-desc-{{competencyDisplayName}}"
        class="screen-reader-only">{{ count }} {{ badgeLabel }} {{ count > 1 ? 'faults' : 'fault' }}
      </div>
    </div>
  }
</div>
