<ion-card id="logout-modal-card" class="modal-alert">
  <ion-row class="ion-justify-content-center">
    <ion-col class="center-items no-padding">
      <ion-text id="logout-title" class="des-header-style-2 header-padding">
        Exit DES?
      </ion-text>
    </ion-col>
  </ion-row>
  <ion-row class="ion-justify-content-center">
    <ion-col class="message-container center-items no-padding message-padding">
      <ion-text id="navigation-warning" class="mes-data ion-text-center">
        The feature stopping notifications being received will be deactivated and you will to be taken to Microsoft teams.
      </ion-text>
    </ion-col>
  </ion-row>
  <ion-row class="ion-justify-content-center">
    <ion-col class="message-container center-items no-padding message-padding">
      <ion-text id="return-message" class="mes-data ion-text-center">
        You can return to DES by pressing the button in the top left corner.
      </ion-text>
    </ion-col>
  </ion-row>
  <ion-row class="ion-justify-content-center">
    <ion-col class="message-container center-items no-padding message-padding">
      <ion-text id="confirmation-message" class="mes-data ion-text-center">
        Are you sure you want to exit DES?
      </ion-text>
    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col class="column-border-top column-border-right ion-no-padding">
      <ion-button id="cancel-button" fill="clear" (click)="onCancel()">
        <ion-text class="mes-data">Cancel</ion-text>
      </ion-button>
    </ion-col>
    <ion-col class="column-border-top ion-no-padding">
      <ion-button id="exit-button" fill="clear" (click)="onExit()">
        <ion-text class="mes-data">Exit</ion-text>
      </ion-button>
    </ion-col>
  </ion-row>
</ion-card>
