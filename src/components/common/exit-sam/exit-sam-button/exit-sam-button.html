<ion-button
  aria-label="Disable single app mode and open Microsoft Teams"
  [id]="pageTitle+'-exit-sam-button'"
  class="display-flex height-100 call-icon-button purple-background"
  (click)="onClick()"
  (touchstart)="onTouchStart()"
  (touchend)="onTouchEnd()">
  <ion-icon class="mes-white" name="call"></ion-icon>
  <ion-text class="mes-white">Teams</ion-text>
</ion-button>
