<ion-card id="practice-mode-exit-sam-modal-card" class="modal-alert">
    <ion-row class="ion-justify-content-center">
        <ion-col class="center-items no-padding">
            <modal-alert-title id="practice-mode-exit-sam-title">You are in practice mode</modal-alert-title>
        </ion-col>
    </ion-row>
    <ion-row class="ion-justify-content-center">
        <ion-col class="message-container center-items no-padding message-padding">
            <ion-text id="practice-mode-exit-sam-message" class="mes-data ion-text-center">
                Opening Microsoft Teams is unavailable in practice mode
            </ion-text>
        </ion-col>
    </ion-row>
    <ion-row>
        <ion-col class="column-border-top column-border-right ion-no-padding">
            <ion-button id="practice-mode-exit-sam-ok-button" fill="clear" (click)="onOk()">
                <ion-text class="mes-data">Ok</ion-text>
            </ion-button>
        </ion-col>
    </ion-row>
</ion-card>
