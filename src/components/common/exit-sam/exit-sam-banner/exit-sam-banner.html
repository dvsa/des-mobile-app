<ion-toolbar
  (touchstart)="onTouchStart()"
  (touchend)="onTouchEnd()"
  [id]="pageTitle+'-exit-banner'"
  class="exit-banner-toolbar-sizing">
  @if (showSpacingBanner) {
    <ion-row class="status-bar-spacing"></ion-row>
  }
  <ion-row class="banner-details-spacing">
    <ion-col></ion-col>
    <ion-col
      size="auto"
      [id]="pageTitle+'-exit-banner-title-text'"
      class="exit-banner-text-column ion-no-padding"
      >
      <ion-text class="exit-banner-text">
        Press and hold to open Microsoft Teams
      </ion-text>
    </ion-col>
    <ion-col size="2"></ion-col>
    <ion-col size="auto" class="ion-no-padding">
      <ion-button
        (click)="cancelButtonClicked()"
        [id]="pageTitle+'-exit-banner-cancel-button'"
        class="display-flex cancel-button">
        <ion-text class="static-font-size mes-black">Cancel</ion-text>
      </ion-button>
    </ion-col>
    <ion-col></ion-col>
  </ion-row>
</ion-toolbar>
