<ion-toolbar
  [id]="pageTitle+'-exit-banner'"
  class="exit-banner-toolbar-sizing">
  <ion-row class="status-bar-spacing"></ion-row>
  <ion-row class="flex-center">
    <ion-col size="auto" class="width-100">
      <ion-text class="exit-banner-text">
        Exit DES app?
      </ion-text>
    </ion-col>
  </ion-row>

  <ion-row class="banner-details-spacing flex-center">

    <ion-col class="align-center">
      <ion-buttons class="exit-sam-button align-center">
        <ion-button
          class="width-100"
          (click)="cancelButtonClicked()"
          [id]="pageTitle+'-escape-sam-cancel-button'">
          <ion-text class="exit-button-text exit-button-text-bold"><b>Return to test</b></ion-text>
        </ion-button>
      </ion-buttons>
    </ion-col>

    <ion-col class="align-center">
      <ion-buttons class="exit-sam-button align-center">
        <ion-button
          class="width-100"
          (click)="escapeSAM()"
          [id]="pageTitle+'-open-microsoft-teams-button'">
          <ion-text class="exit-button-text"><b>Open Microsoft Teams</b></ion-text>
        </ion-button>
      </ion-buttons>
    </ion-col>

  </ion-row>
</ion-toolbar>
