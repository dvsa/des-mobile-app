<ion-row>
  <ion-col class="display-flex flex-direction-column ion-align-items-center">
    <ion-row>
      <ion-icon
        [class.hidden]="!shouldShowUpArrow(TimeUnits.HOUR)"
        class="ion-activatable mes-data"
        (click)="iterateNumbers(TimeUnits.HOUR, 1, minimumHour, maximumHour)"
        size="large"
        [name]="'chevron-up-outline'">
      </ion-icon>
    </ion-row>
    <ion-row class="spacing-padding">
      <ion-input
        #hourInput
        [(ngModel)]="selectedHour"
        (ionFocus)="setFocusOnInputBox(hourInput, false, true)"
        (ionChange)="inputEnteredManually(TimeUnits.HOUR, $event.detail.value)"
        (ionInput)="hourBoxInputted($event)"
        maxlength="2"
        numbersOnly
        inputmode="numeric"
        (keydown.tab)="tabPressed(TimeUnits.HOUR)"
        (keydown.arrowLeft)="saveCurrentFocusPosition(hourInput)"
        (keydown.arrowRight)="saveCurrentFocusPosition(hourInput)"
        (keyup.arrowRight)="horizontalArrowPressed(KeyCodes.RIGHT, TimeUnits.HOUR, hourInput)"
        (keyup.arrowLeft)="horizontalArrowPressed(KeyCodes.LEFT, TimeUnits.HOUR, hourInput)"
        (keyup.arrowDown)="verticalArrowPressed(KeyCodes.DOWN, TimeUnits.HOUR)"
        (keyup.arrowUp)="verticalArrowPressed(KeyCodes.UP, TimeUnits.HOUR)"
        id="time-picker-hour-input"
        type="text"
        class="mes-text-align-centre remove-internal-padding input-width">
      </ion-input>
    </ion-row>
    <ion-row>
      <ion-icon
        [class.hidden]="!shouldShowDownArrow(TimeUnits.HOUR)"
        class="ion-activatable mes-data"
        (click)="iterateNumbers(TimeUnits.HOUR, -1, minimumHour, maximumHour)"
        size="large"
        [name]="'chevron-down-outline'">
      </ion-icon>
    </ion-row>
  </ion-col>
  <ion-col size="6" class="display-flex mes-text-align-centre ion-justify-content-center ion-align-items-center">
    <ion-text class="mes-data">:</ion-text>
  </ion-col>
  <ion-col class="display-flex flex-direction-column ion-align-items-center">
    <ion-row>
      <ion-icon
        [class.hidden]="!shouldShowUpArrow(TimeUnits.MINUTE)"
        class="ion-activatable mes-data"
        (click)="iterateNumbers(TimeUnits.MINUTE, 1, minimumMinute, maximumMinute)"
        size="large"
        [name]="'chevron-up-outline'"></ion-icon>
    </ion-row>
    <ion-row class="spacing-padding">
      <ion-input
        (ionFocus)="setFocusOnInputBox(minuteInput, false, true)"
        (ionChange)="inputEnteredManually(TimeUnits.MINUTE, $event.detail.value)"
        [(ngModel)]="selectedMinute"
        (ionInput)="minuteBoxInputted($event)"
        #minuteInput
        inputmode="numeric"
        maxlength="2"
        numbersOnly
        (keydown.tab)="tabPressed(TimeUnits.MINUTE)"
        (keydown.arrowLeft)="saveCurrentFocusPosition(minuteInput)"
        (keydown.arrowRight)="saveCurrentFocusPosition(minuteInput)"
        (keyup.arrowRight)="horizontalArrowPressed(KeyCodes.RIGHT, TimeUnits.MINUTE, minuteInput)"
        (keyup.arrowLeft)="horizontalArrowPressed(KeyCodes.LEFT, TimeUnits.MINUTE, minuteInput)"
        (keyup.arrowDown)="verticalArrowPressed(KeyCodes.DOWN, TimeUnits.MINUTE)"
        (keyup.arrowUp)="verticalArrowPressed(KeyCodes.UP, TimeUnits.MINUTE)"
        type="text"
        id="time-picker-minute-input"
        class="mes-text-align-centre remove-internal-padding input-width">
      </ion-input>
    </ion-row>
    <ion-row>
      <ion-icon
        [class.hidden]="!shouldShowDownArrow(TimeUnits.MINUTE)"
        class="ion-activatable mes-data"
        (click)="iterateNumbers(TimeUnits.MINUTE, -1, minimumMinute, maximumMinute)"
        size="large"
        [name]="'chevron-down-outline'"></ion-icon>
    </ion-row>
  </ion-col>
</ion-row>
<ion-row>
  <ion-col class="display-flex ion-justify-content-center">
    <ion-text class="mes-data">Hours</ion-text>
  </ion-col>
  <ion-col size="6"></ion-col>
  <ion-col class="display-flex ion-justify-content-center">
    <ion-text class="mes-data">Mins</ion-text>
  </ion-col>
</ion-row>
