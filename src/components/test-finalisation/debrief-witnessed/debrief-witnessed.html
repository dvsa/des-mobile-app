<ion-row
  *ngIf="display"
  [class.mes-row-separator]="shouldShowSeparator"
  class="mes-validated-row"
  id="debrief-card"
  [formGroup]="formGroup"
>
  <div class="validation-bar" [class.ng-invalid]="invalid"></div>
  <ion-col class="component-label ion-align-self-center" size="32">
    <label id="debrief-witnessed-label">Debrief witnessed</label>
  </ion-col>
  <ion-col class="ion-align-self-center mes-padding-left">
    <ion-row class="spacing-row"></ion-row>
    <ion-row>
      <ion-radio-group
        class="display-flex radio-group-width"
        formControlName="debriefWitnessed"
        [value]="formControl.value"
        (ionChange)="debriefWitnessedChanged($event.detail.value)">
        <ion-col size="40">
          <ion-radio
            class="gds-refactor-radio"
            id="debrief-witnessed-yes"
            [class.ng-invalid]="invalid"
            labelPlacement="end"
            [value]="true">
            <label class="radio-label" id="debrief-witnessed-yes-label">
              Yes
            </label>
          </ion-radio>
        </ion-col>
        <ion-col></ion-col>
        <ion-col size="40">
          <ion-radio
            class="gds-refactor-radio"
            id="debrief-witnessed-no"
            [value]="false"
            [class.ng-invalid]="invalid"
            labelPlacement="end">
            <label class="radio-label" id="debrief-witnessed-no-label">
              No
            </label>
          </ion-radio>
        </ion-col>
      </ion-radio-group>
    </ion-row>
    <ion-row class="validation-message-row ion-align-items-center">
      <div class="validation-text" [class.ng-invalid]="invalid" id="debrief-witnessed-validation-text">
        Was the debrief witnessed?
      </div>
    </ion-row>
  </ion-col>
</ion-row>
