<ion-row class="mes-validated-row mes-row-separator" id="lang-pref-card" [formGroup]="formGroup">
  <div class="validation-bar"></div>
  <ion-col class="component-label ion-align-self-center" size="32">
    <label id="lang-pref-label">Test language</label>
  </ion-col>
  <ion-col class="ion-align-self-center mes-padding-left">
    <ion-row class="spacing-row"></ion-row>
    <ion-row>
      <ion-radio-group
        class="display-flex radio-group-width"
        formControlName="languagePreferences"
        [value]="languagePref.value"
        (ionChange)="isWelshChanged($event.detail.value)">
        <ion-col size="40">
          <ion-radio
            class="gds-refactor-radio"
            id="lang-pref-english"
            labelPlacement="end"
            value="English">
            <label class="radio-label" id="language-pref-english-label">
              English
            </label>
          </ion-radio>
        </ion-col>
        <ion-col size="16"></ion-col>
        <ion-col>
          <ion-radio
            class="gds-refactor-radio"
            id="lang-pref-welsh"
            value="Cymraeg"
            labelPlacement="end">
            <label class="radio-label" id="language-pref-cymraeg-label">
              Cymraeg
            </label>
          </ion-radio>
        </ion-col>
      </ion-radio-group>
    </ion-row>
    <ion-row class="validation-message-row ion-align-items-center">
      <div class="validation-text"></div>
    </ion-row>
  </ion-col>
</ion-row>
