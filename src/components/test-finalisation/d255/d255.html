<ion-row *ngIf="display" class="mes-validated-row mes-row-separator" id="d255-card" [formGroup]="formGroup">
  <div class="validation-bar" [class.ng-invalid]="invalid"></div>
  <ion-col class="component-label ion-align-self-center" size="32">
    <label id="d255-label">D255</label>
  </ion-col>
  <ion-col class="ion-align-self-center mes-padding-left">
    <ion-row class="spacing-row"></ion-row>
    <ion-row>
      <ion-radio-group
        class="display-flex radio-group-width"
        formControlName="d255"
        [value]="formControl.value"
        (ionChange)="d255Changed($event.detail.value)">
        <ion-col size="40">
          <ion-radio
            class="gds-refactor-radio"
            id="d255-yes"
            [class.ng-invalid]="invalid"
            labelPlacement="end"
            [value]="true">
            <label class="radio-label" id="d255-yes-label">
              Yes
            </label>
          </ion-radio>
        </ion-col>
        <ion-col></ion-col>
        <ion-col size="40">
          <ion-radio
            class="gds-refactor-radio"
            id="d255-no"
            [class.ng-invalid]="invalid"
            [value]="false"
            labelPlacement="end">
            <label class="radio-label" id="d255-no-label">
              No
            </label>
          </ion-radio>
        </ion-col>
      </ion-radio-group>
    </ion-row>
    <ion-row class="validation-message-row ion-align-items-center">
      <div class="validation-text" [class.ng-invalid]="invalid" id="d255-validation-text">Select D255</div>
    </ion-row>
  </ion-col>
</ion-row>
