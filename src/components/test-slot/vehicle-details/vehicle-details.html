<div class="vehicle-details-row">
  <span>L: </span><span class="bold">{{ length }}</span> metres. <span>W: </span><span class="bold">{{ width }}</span> metres.
  <span>H: </span><span class="bold">{{ height }}</span> metres.
  @if (showNumberOfSeats) {
    <span>Seats: </span>
    <span class="bold">{{ seats }}</span>
  }
</div>
